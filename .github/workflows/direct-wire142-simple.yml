name: Direct arena wiring runner
on:
  workflow_dispatch:
  push:
    branches:
      - direct-gecko-arena142
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply renderer wiring
        run: |
          set -euo pipefail
          python3 tools/wire_arena142.py
          git diff --check
          git add app/src/main/java/com/mekromn/bubble/FloatingGeckoWindow.kt app/src/main/java/com/mekromn/bubble/FloatingWindow.kt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'feat(renderer): wire live relay/direct transport switch in floating window'
            git push origin HEAD:direct-gecko-arena142
          fi
