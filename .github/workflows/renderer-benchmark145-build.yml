name: Bubble 145 renderer benchmark validation
on:
  workflow_dispatch:
  push:
    branches: [renderer-benchmark145]
    paths:
      - 'app/**'
      - '.github/workflows/renderer-benchmark145-build.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-37.1' 'build-tools;36.0.0'
      - name: Source and native invariants
        run: |
          set -euo pipefail
          grep -q 'versionCode = 145' app/build.gradle.kts
          grep -q 'RendererBenchmark.beforePage(view, event)' app/src/main/java/com/mekromn/bubble/PageTouchDispatch.kt
          grep -q 'RendererBenchmark.afterPage(benchmark, event)' app/src/main/java/com/mekromn/bubble/PageTouchDispatch.kt
          grep -q 'Quick measured A/B · 4 pairs' app/src/main/java/com/mekromn/bubble/RendererArenaActivity.kt
          grep -q 'Rigorous measured A/B · 8 pairs' app/src/main/java/com/mekromn/bubble/RendererArenaActivity.kt
          grep -q 'bootstrapMedianCi' app/src/main/java/com/mekromn/bubble/RendererBenchmark.kt
          grep -q 'UNBUFFERED_140 for BOTH renderer arms' app/src/main/java/com/mekromn/bubble/RendererBenchmark.kt
          node tools/test-foreground.cjs
          node tools/test-fast-build.cjs
          node tools/test-hardware-policy.cjs
          node tools/test-embedded-page.cjs
          bash tools/test-relay-native.sh
      - name: Build optimized ARM64 benchmark APK
        run: |
          set -euo pipefail
          gradle --no-daemon :app:testPerformanceUnitTest :app:assemblePerformance :app:lintPerformance
          mkdir -p dist
          cp app/build/outputs/apk/performance/app-performance.apk dist/Bubble-145-RENDERER-BENCHMARK-ARM64.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs dist/Bubble-145-RENDERER-BENCHMARK-ARM64.apk > dist/signature.txt
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest print dist/Bubble-145-RENDERER-BENCHMARK-ARM64.apk > dist/AndroidManifest.xml
          python3 tools/audit-hardware-apk.py dist/Bubble-145-RENDERER-BENCHMARK-ARM64.apk --out dist/HARDWARE_AUDIT.json
          sha256sum dist/Bubble-145-RENDERER-BENCHMARK-ARM64.apk > dist/SHA256SUMS
          git rev-parse HEAD > dist/SOURCE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: bubble-renderer-benchmark145-arm64
          path: dist/
          retention-days: 7
      - name: Build optimized x86_64 app and instrumentation
        run: gradle --no-daemon -PgeckoAbi=x86_64 :app:assemblePerformance :app:assemblePerformanceAndroidTest
      - run: sudo chmod a+rw /dev/kvm
      - name: Prove benchmark-idle app preserves the passing 144 renderer topology
        id: runtime
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: default
          profile: pixel_2
          ram-size: 3072M
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save
          script: |
            adb shell wm size 720x1280
            adb shell wm density 280
            sleep 20
            adb install -r app/build/outputs/apk/performance/app-performance.apk
            adb install -r app/build/outputs/apk/androidTest/performance/app-performance-androidTest.apk
            adb logcat -c
            timeout 300s adb shell am instrument -w -e class com.mekromn.bubble.RendererABTopologyRuntimeTest com.mekromn.bubble.debug.test/androidx.test.runner.AndroidJUnitRunner > benchmark145-runtime.txt 2>&1 || true
            adb logcat -d > benchmark145-logcat.txt
            adb pull /sdcard/Android/data/com.mekromn.bubble.debug/files/evidence runtime-evidence || true
            cat benchmark145-runtime.txt
            grep -q 'OK (1 test)' benchmark145-runtime.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bubble-renderer-benchmark145-runtime
          path: |
            benchmark145-runtime.txt
            benchmark145-logcat.txt
            runtime-evidence/
          retention-days: 7
