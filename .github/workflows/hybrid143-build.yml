name: Bubble 143 direct hybrid build
on:
  workflow_dispatch:
  push:
    branches:
      - hybrid-direct143
    paths:
      - 'app/src/main/**'
      - 'app/build.gradle.kts'
      - 'app/proguard-*.pro'
      - 'tools/**'
      - '.github/workflows/hybrid143-build.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-37.1' 'build-tools;36.0.0'
      - name: Existing regressions plus hybrid source invariants
        run: |
          set -euo pipefail
          node tools/test-foreground.cjs
          node tools/test-fast-build.cjs
          node tools/test-hardware-policy.cjs
          node tools/test-embedded-page.cjs
          bash tools/test-relay-native.sh
          python3 - <<'PY'
          from pathlib import Path
          direct=Path('app/src/main/java/com/mekromn/bubble/DirectGeckoWindow.kt').read_text()
          assert 'LiveGeckoView(context)' in direct
          assert 'setViewBackend(GeckoView.BACKEND_SURFACE_VIEW)' in direct
          for forbidden in ('NativeAhbBridge','GeckoDisplay.SurfaceInfo','panZoomController.onTouchEvent','textInput.setView','accessibility.setView'):
              assert forbidden not in direct, forbidden
          renderer=Path('app/src/main/java/com/mekromn/bubble/RendererArena.kt').read_text()
          assert 'var transport: Transport = Transport.DIRECT_GECKO_SURFACE' in renderer
          handoff=Path('app/src/main/java/com/mekromn/bubble/FullscreenHandoff.kt').read_text()
          assert 'captureFloatingFrame' in handoff and 'finishIntoFullscreen' in handoff
          assert 'makeClipRevealAnimation' not in handoff
          manifest=Path('app/src/main/AndroidManifest.xml').read_text()
          assert 'RendererArenaActivity' not in manifest
          PY
      - name: Build optimized ARM64 hybrid
        run: |
          set -euo pipefail
          echo '4a907a5d115b37e1ea77bc2d744c165e6c3afa4d1aa2faa4762f7d6e1f8d3151  app/signing/bubble-debug.jks' | sha256sum -c -
          gradle --no-daemon :app:testPerformanceUnitTest :app:assemblePerformance :app:lintPerformance 2>&1 | tee hybrid-build.txt
          mkdir -p dist
          cp app/build/outputs/apk/performance/app-performance.apk dist/Bubble-143-DIRECT-HYBRID-ARM64.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs dist/*.apk > dist/signature.txt
          grep -q '001a6f40ddcff14aec3aca71964fec58c29a32bdd0c649285bce60ae940c2b1f' dist/signature.txt
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest print dist/*.apk > dist/AndroidManifest.xml
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root=ET.parse('dist/AndroidManifest.xml').getroot();ns='{http://schemas.android.com/apk/res/android}'
          assert root.attrib['package']=='com.mekromn.bubble.debug'
          assert root.attrib[ns+'versionCode']=='143'
          app=root.find('application');assert app.attrib.get(ns+'debuggable','false')=='false';assert app.attrib.get(ns+'hardwareAccelerated')=='true'
          PY
          python3 tools/audit-hardware-apk.py dist/Bubble-143-DIRECT-HYBRID-ARM64.apk --out dist/HARDWARE_AUDIT.json
          sha256sum dist/*.apk > dist/SHA256SUMS
          git rev-parse HEAD > dist/SOURCE.txt
          git archive HEAD -- . ':!app/signing' | gzip > dist/source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: bubble-hybrid143-arm64
          path: dist/
          retention-days: 7
      - name: Build optimized x86_64 browser and test
        run: gradle --no-daemon -PgeckoAbi=x86_64 :app:assemblePerformance :app:assemblePerformanceAndroidTest 2>&1 | tee hybrid-emulator-build.txt
      - run: sudo chmod a+rw /dev/kvm
      - name: Real direct browsing and both snapshot window morphs
        id: runtime
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: default
          profile: pixel_2
          ram-size: 3072M
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save
          script: |
            adb shell wm size 720x1280
            adb shell wm density 280
            sleep 20
            adb install -r app/build/outputs/apk/performance/app-performance.apk
            adb install -r app/build/outputs/apk/androidTest/performance/app-performance-androidTest.apk
            adb logcat -c
            timeout 300s adb shell am instrument -w -e class com.mekromn.bubble.HybridDirectRuntimeTest com.mekromn.bubble.debug.test/androidx.test.runner.AndroidJUnitRunner > hybrid-runtime.txt 2>&1 || true
            adb logcat -d > hybrid-logcat.txt
            adb pull /sdcard/Android/data/com.mekromn.bubble.debug/files/evidence runtime-evidence || true
            cat hybrid-runtime.txt
            grep -q 'OK (1 test)' hybrid-runtime.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bubble-hybrid143-runtime
          path: |
            hybrid-runtime.txt
            hybrid-logcat.txt
            hybrid-*.txt
            runtime-evidence/
          retention-days: 7
