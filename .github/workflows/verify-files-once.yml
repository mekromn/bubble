name: Verify browser file transfers
# Consolidated verification for unrestricted attachment selection, no-stale ChatGPT resume,
# localized glass blur that never blurs the Gecko content window and remains continuously requested
# during drag/resize/animation, genuine circular resting-bubble compositor blur, adjustable bubble
# opacity, drag-to-reorder tab order, protected Google Voice notification channels, and the existing
# file/session/profile/floating/edge runtime gates. API-31 blur calls remain runtime-gated on the
# min-26 app. Runtime failure still publishes a clearly marked UNVERIFIED ARM64 APK when compilation/
# signing succeeds so physical-device validation can continue.
on:
  push:
    branches: [rebuild-v2]
    paths: ['.github/workflows/verify-files-once.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    if: github.repository == 'mekromn/bubble' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[verify-files]'))
    uses: ./.github/workflows/android.yml
