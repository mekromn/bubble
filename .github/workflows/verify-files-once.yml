name: Verify current Bubble changes
# Emulator time is deliberately scoped to current work, not an ever-growing historical suite.
# Archive Picker passed build 62. The aspect-preserving screenshot morph is still current transition
# work and remains the Android runtime gate until its Pixel behavior is accepted.
#
# Final Bubble 0.7.4 current-head verification: Android-16 Archive Picker insets/full-width rows,
# swipe-up Your chats, fullscreen compositor blur, reliable loading-driven refresh rotation,
# remembered last share target, profile-isolated local saved-chat indexing/search, native Your-chats
# New Chat staging, 70k continuity handoffs, exact-origin chunked Gecko messaging, no credential/cloud
# export path, cold-start-stable focused UI/Vault runtime tests, archive runtime, dialog tray regressions,
# and the fullscreen-to-floating handoff with a laid-out synthetic source gesture.
on:
  push:
    branches: [rebuild-v2]
    paths: ['.github/workflows/verify-files-once.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    if: github.repository == 'mekromn/bubble' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[verify-files]'))
    uses: ./.github/workflows/android.yml
