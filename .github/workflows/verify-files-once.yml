name: Verify browser file transfers
# Consolidated verification: real SAF uploads, original Gecko response downloads, parked notification restore,
# compact refresh/share chrome, requested floating/tab order, and floating swipe-to-minimize behavior.
on:
  push:
    branches: [rebuild-v2]
    paths: ['.github/workflows/verify-files-once.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    if: github.repository == 'mekromn/bubble' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[verify-files]'))
    uses: ./.github/workflows/android.yml
