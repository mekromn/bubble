name: Verify current Bubble changes
# Emulator time is deliberately scoped to the feature being changed now, not an ever-growing
# historical regression queue. Previously-proven file transfer, page appearance, animations and
# tab behavior remain in source coverage but are not re-run on every build.
#
# Current gate: Bubble-owned Archive Picker. Chat/file prompts now route through a native local file
# browser, can select multiple files even when the webpage ultimately receives one attachment, stream
# the selected bytes directly into a single ZIP, handle duplicate names, preserve safe relative paths,
# report progress/cancel, expose external results with a FileProvider, and retain provider browsing as
# an explicit fallback. The runtime gate exercises the archive engine itself; the Pixel is the UI and
# provider-integration oracle. This build also makes the active chat visually unmistakable.
on:
  push:
    branches: [rebuild-v2]
    paths: ['.github/workflows/verify-files-once.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    if: github.repository == 'mekromn/bubble' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[verify-files]'))
    uses: ./.github/workflows/android.yml
