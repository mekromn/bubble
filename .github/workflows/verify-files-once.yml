name: Verify current Bubble changes
# Emulator time is deliberately scoped to current work, not an ever-growing historical suite.
# Archive Picker passed build 62. The aspect-preserving screenshot morph is still current transition
# work and remains the Android runtime gate until its Pixel behavior is accepted.
#
# Bubble 0.7.6 verification: retain all 0.7.5 cumulative Vault/history/continuity behavior, and fix
# trusted target=_blank GitHub release/archive asset activations before Gecko creates a child tab.
# Exact GitHub download endpoints are routed through the opener session so onExternalResponse owns
# the original file response and the active document remains selected; ordinary GitHub pages/raw
# source keep normal tab behavior. Existing focused UI/Vault/archive/dialog/transition gates remain.
on:
  push:
    branches: [rebuild-v2]
    paths: ['.github/workflows/verify-files-once.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    if: github.repository == 'mekromn/bubble' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[verify-files]'))
    uses: ./.github/workflows/android.yml
