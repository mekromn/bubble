name: Verify current Bubble changes
# Emulator time is deliberately scoped to the feature being changed now, not an ever-growing
# historical regression queue. Previously-proven file transfer, page appearance, pill gestures,
# readiness colors and the accepted floating -> fullscreen clip reveal remain in source coverage but
# are not part of this build's emulator gate.
#
# Current gate: fullscreen -> floating only. Bubble freezes the exact fullscreen browser before Gecko
# changes window owners. Native chrome comes from Window PixelCopy; Gecko's actual fullscreen
# SurfaceView is discovered in the live GeckoView hierarchy and PixelCopied independently, then
# composited into the same frame at its exact screen rectangle. Gecko capturePixels remains a bounded
# fallback. The floating overlay is already at final layout; that one complete screenshot stretches
# into the saved bounds and cross-fades into the live card only at the end. The reverse direction
# intentionally remains the previously accepted Android clip-reveal path.
on:
  push:
    branches: [rebuild-v2]
    paths: ['.github/workflows/verify-files-once.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    if: github.repository == 'mekromn/bubble' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[verify-files]'))
    uses: ./.github/workflows/android.yml