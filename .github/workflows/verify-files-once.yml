name: Verify current Bubble changes
# Emulator time is deliberately scoped to current work, not an ever-growing historical suite.
# Archive Picker passed build 62. The aspect-preserving screenshot morph remains the current
# transition regression gate.
#
# Current verification covers cumulative Continuity Vault merging, explicit same-origin full-history
# sync, Archive-all-open-chats, long-press New Chat continuity cloning, any-running-tab transcript
# command automation, the continuity-first companion skill contract, two-check 30-minute idle tab
# maintenance, the output-driven 30-minute generation-stall watchdog, and the GitHub download-tab
# fix. Full-history sync now learns and replays the exact successful live ChatGPT conversation GET
# before using the legacy hard-coded endpoint fallback. The monitor harness validates this boundary.
# Existing focused UI/Vault/archive/dialog/transition gates remain.
on:
  push:
    branches: [rebuild-v2]
    paths: ['.github/workflows/verify-files-once.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    if: github.repository == 'mekromn/bubble' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[verify-files]'))
    uses: ./.github/workflows/android.yml
