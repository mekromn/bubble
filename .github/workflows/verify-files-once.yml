name: Verify current Bubble changes
# Emulator time is deliberately scoped to the features being changed now, not an ever-growing
# historical regression queue. Previously-proven file-transfer and older appearance regressions
# remain in source but are no longer part of every build's emulator gate.
#
# Current gate: floating-window chrome/gesture behavior plus the Google Voice mixed-theme Force
# Dark fix and the true matched fullscreen <-> floating morph. The handoff captures native chrome
# and Gecko compositor pixels before surface ownership changes, places that exact frame in one
# transparent system overlay, and morphs a single visible card continuously through position, size,
# corner radius and destination-frame fade-through. Content uses uniform center-crop scaling rather
# than X/Y stretching, the temporary overlay spans Pixel cutout bounds exactly, and the real source
# or destination stays hidden until the held card occupies the same geometry. Source contraction
# begins as soon as the old Activity loses task focus. The shared surface absorbs touch, requests the
# fastest display mode, and morphs its opaque backing continuously into/out of floating glass so
# combined opacity never drops and no foreign window can bleed through. Runtime performs a complete
# fullscreen -> floating -> fullscreen -> floating round trip and checks a real system screenshot near
# each handoff midpoint. Fullscreen ownership is published synchronously before service teardown.
# Gecko compositor capture is now bounded to 240 ms and the full-screen destination capture to 520 ms;
# source and destination morphs also have final watchdogs. A missed SurfaceView/PixelCopy callback can
# therefore degrade to the already-valid held frame but can never leave a frozen full-screen overlay.
on:
  push:
    branches: [rebuild-v2]
    paths: ['.github/workflows/verify-files-once.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    if: github.repository == 'mekromn/bubble' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[verify-files]'))
    uses: ./.github/workflows/android.yml
