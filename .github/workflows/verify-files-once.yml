name: Verify browser file transfers
# Consolidated verification for unrestricted attachment selection, no-stale ChatGPT resume,
# localized glass blur that never blurs the Gecko content window, adjustable bubble opacity,
# drag-to-reorder tab order, protected Google Voice notification channels, and the existing
# file/session/profile/floating/edge runtime gates. This pass also verifies the nullable Gecko
# Android-permission callback used by the Google Voice notification bridge. Runtime failure still
# publishes a clearly marked UNVERIFIED ARM64 APK when compilation/signing succeeds.
on:
  push:
    branches: [rebuild-v2]
    paths: ['.github/workflows/verify-files-once.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    if: github.repository == 'mekromn/bubble' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[verify-files]'))
    uses: ./.github/workflows/android.yml
