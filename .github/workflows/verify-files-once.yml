name: Verify current Bubble changes
# Emulator time is deliberately scoped to the feature being changed now, not an ever-growing
# historical regression queue. Previously-proven file transfer, page appearance, pill gestures,
# readiness colors and the accepted floating -> fullscreen clip reveal remain in source coverage but
# are not part of this build's emulator gate.
#
# Current gate: fullscreen -> floating only. Build 55 proved headless SwiftShader UiAutomation
# screenshots omit Gecko SurfaceView pixels even before any transition, so system screenshots are not
# a valid oracle for this renderer. The gate therefore validates the actual frozen intermediate Bubble
# will animate. Native Activity chrome comes from Window PixelCopy; Gecko capturePixels is now the
# canonical webpage source because it reads compositor output independent of child SurfaceView
# topology. The largest attached SurfaceView is only a bounded fallback and is mapped to GeckoView's
# actual viewport. The completed source must contain the painted webpage, the dedicated overlay must
# attach/start, and the real floating card must finish visible at its saved geometry. Floating ->
# fullscreen intentionally remains the previously accepted Android clip-reveal path.
on:
  push:
    branches: [rebuild-v2]
    paths: ['.github/workflows/verify-files-once.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    if: github.repository == 'mekromn/bubble' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[verify-files]'))
    uses: ./.github/workflows/android.yml