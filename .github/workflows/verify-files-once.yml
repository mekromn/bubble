name: Verify browser file transfers
# Consolidated verification after the strongly typed real-Gecko touch fixture fix, with isolated runtime groups and Blob-source stage diagnostics: real SAF uploads/downloads including generated Blob files,
# parked restore, compact refresh/share chrome, adaptive ChatGPT tab residency, and matched floating/fullscreen/minimize motion.
on:
  push:
    branches: [rebuild-v2]
    paths: ['.github/workflows/verify-files-once.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    if: github.repository == 'mekromn/bubble' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[verify-files]'))
    uses: ./.github/workflows/android.yml
