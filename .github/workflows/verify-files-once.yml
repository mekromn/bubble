name: Verify current Bubble changes
# Emulator time is deliberately scoped to current work, not an ever-growing historical suite.
# The signed ARM64 APK is published immediately after compile/signing; emulator/runtime verification
# continues afterward and upgrades the same release from EARLY manual-test to verified when green.
#
# Current verification covers Continuity Vault/full-history sync, Archive-all-open-chats, long-press
# New Chat continuation, transcript command automation, Google Voice notification/UI enhancements,
# resident/high-priority tab policy, and the floating-browser hybrid performance path.
#
# DEDICATED SURFACEVIEW HYBRID — SURFACE-LESS STAGING:
# - Gecko runtime behavior matches the known-fast Build 84 baseline: remote debugging and console-to-
#   Logcat output are disabled; every other Gecko runtime setting stays at Gecko default. No App
#   Zygote and no accumulated speculative Gecko feature disables.
# - Fullscreen uses Gecko SurfaceView.
# - Floating CHAT also uses Gecko SurfaceView. The historical TextureView request is only a marker;
#   LiveGeckoView translates it to BACKEND_SURFACE_VIEW and never instantiates Gecko TextureView.
# - Floating Gecko is INVISIBLE while temporarily attached to the translucent page slot so SurfaceView
#   cannot create its rendering surface against that bad window. The slot is used only to obtain page
#   geometry. The same GeckoView/session is removed while still surface-less, attached as its own
#   PixelFormat.OPAQUE hardware-accelerated TYPE_APPLICATION_OVERLAY root, and only then made VISIBLE.
# - Same-window SurfaceView Z-order/composition-order tricks remain gone. The geometry anchor follows
#   normal layout/pre-draw traversal; WindowManager is updated only when x/y/size actually changes.
# - Dedicated-window attachment failures are logged and shown on-device rather than silently swallowed;
#   there is still no TextureView fallback.
# - Floating glass uses one service-owned backdrop window, matching Build 84's low layer count. CHAT
#   uses a top/bottom alpha mask for the 52dp header and 48dp footer, leaving the rendered page center
#   visually blur-free. Glass stays live during move/resize.
# - Hardware acceleration, maximum-refresh voting, current resident active/high-priority behavior,
#   all current Continuity/Voice features, profile isolation and security invariants remain unchanged.
#
# Credentials never cross to the isolated/native Vault bridge. Existing focused UI/Vault/archive/
# dialog/transition gates remain.
on:
  push:
    branches: [rebuild-v2]
    paths: ['.github/workflows/verify-files-once.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    if: github.repository == 'mekromn/bubble' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[verify-files]'))
    uses: ./.github/workflows/android.yml
