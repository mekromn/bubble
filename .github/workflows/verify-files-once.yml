name: Verify current Bubble changes
# Emulator time is deliberately scoped to the feature being changed now, not an ever-growing
# historical regression queue. Previously-proven file transfer, page appearance, pill gestures,
# readiness colors and the accepted floating -> fullscreen clip reveal remain in source coverage but
# are not part of this build's emulator gate.
#
# Current gate: fullscreen -> floating only. Bubble freezes the exact fullscreen browser into one
# screenshot layer before Gecko changes window owners. That single screenshot is stretched from the
# fullscreen bounds directly into the saved floating-window bounds while the real floating window
# waits underneath at its final geometry. During the last part of the same motion the screenshot
# fades out while the live floating window fades in. The reverse floating -> fullscreen transition
# intentionally remains the previously accepted Android clip-reveal implementation.
on:
  push:
    branches: [rebuild-v2]
    paths: ['.github/workflows/verify-files-once.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    if: github.repository == 'mekromn/bubble' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[verify-files]'))
    uses: ./.github/workflows/android.yml