name: Apply raw focus proxy once
on:
  push:
    branches: [rebuild-v2]
    paths: ['.github/workflows/verify-files-once.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Commit real raw SurfaceView focus proxy
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/com/mekromn/bubble/FloatingGeckoWindow.kt')
          text = path.read_text()
          old = '''        override fun getSession(): GeckoSession? = bound

        override fun setSession(session: GeckoSession) {'''
          new = '''        override fun getSession(): GeckoSession? = bound

        // Workspace focus policy asks its GeckoView-shaped owner for window focus. The bridge is
        // intentionally detached, so proxy the real raw SurfaceView window instead of reporting
        // false forever. This gives floating Gecko the same native focus semantics as fullscreen.
        override fun hasWindowFocus(): Boolean = raw.hasWindowFocus()

        override fun setSession(session: GeckoSession) {'''
          if text.count(old) != 1:
              raise SystemExit(f'Expected one insertion point, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/mekromn/bubble/FloatingGeckoWindow.kt
          git diff --cached --check
          git commit -m 'perf: proxy floating Gecko focus from raw page window'
          git push origin HEAD:rebuild-v2
