name: Verify current Bubble changes
# Emulator time is deliberately scoped to current work, not an ever-growing historical suite.
# Archive Picker passed build 62. The aspect-preserving screenshot morph is still current transition
# work and remains the Android runtime gate until its Pixel behavior is accepted.
#
# Bubble 0.7.5 final current-head verification: cumulative ChatGPT Vault snapshots that cannot shrink
# on virtualized refresh, passive exact-origin full-history capture from responses ChatGPT already
# fetched (no extra authenticated request, cookies/tokens, scrolls or clicks), native accepted/rejected
# transfer handshake with cold-start replay after the Vault index loads, guaranteed stage-before-open
# continuation ordering, robust textarea/contenteditable/ProseMirror composer insertion with Send left
# user-controlled, plus the current UI/Vault, archive, dialog-tray and fullscreen-to-floating gates.
on:
  push:
    branches: [rebuild-v2]
    paths: ['.github/workflows/verify-files-once.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    if: github.repository == 'mekromn/bubble' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[verify-files]'))
    uses: ./.github/workflows/android.yml
