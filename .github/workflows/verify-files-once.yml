name: Verify current Bubble changes
# Emulator time is deliberately scoped to current work, not an ever-growing historical suite.
# The signed ARM64 APK is published immediately after compile/signing; emulator/runtime verification
# continues afterward and upgrades the same release from EARLY manual-test to verified when green.
#
# RAW GECKODISPLAY SURFACEVIEW FAST PATH — BUILD 105 STABILITY BASELINE:
# - Floating uses GeckoSession.acquireDisplay() -> raw top-Z SurfaceView in its page-only overlay.
# - No TextureView. Gecko accessibility is hosted on the attached page FrameLayout/ViewParent.
# - Fullscreen remains normal GeckoView/SurfaceView. Resident ChatGPT and Google Voice tabs stay
#   active/high priority. App Zygote remains off and Gecko runtime settings stay at Build-84 baseline.
# - Blur remains one masked service-owned compositor window and only covers native chrome.
#
# SPEED PATH:
# - Fullscreen, fullscreen chooser, floating chrome, raw Gecko page Surface and live-glass backdrop
#   all request the highest supported same-resolution refresh mode.
# - Android 15+ View frame-rate requests are recursive, touch boost is enabled, and balanced
#   frame-rate power saving is disabled to favor smoothness.
# - SurfaceView producers receive Surface.setFrameRate() once per Surface lifetime; Android 16 uses
#   FRAME_RATE_COMPATIBILITY_AT_LEAST for UI/scroll/fling.
# - The intentionally detached raw bookkeeping bridge proxies focus for the active floating page so
#   Workspace gives the selected raw GeckoSession the same native focused state as fullscreen.
# - Persistent crash diagnostics remain implemented but DiagnosticLog.ENABLED=false.
#
# TAB / NOTIFICATION ROUTING:
# - NotificationReturnActivity preserves the exact target tab and synchronously rebinds fullscreen.
# - Google Voice WebNotification.click() is delayed until its resident tab is selected/visible/open.
#
# VOICE UI 2.7:
# - The integrated copy-number icon is anchored beside Voice's call control even when the header
#   shows only a contact name; number lookup searches selected-thread/accessibility metadata at use.
# - When Voice returns foreground with a newly-unread conversation, a conservative exact-origin
#   fallback can reveal the mobile conversation list and activate the highest-confidence unread row.
# - No Google CSS class names, network calls, account APIs, or persisted message content are used.
on:
  push:
    branches: [rebuild-v2]
    paths: ['.github/workflows/verify-files-once.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    if: github.repository == 'mekromn/bubble' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[verify-files]'))
    uses: ./.github/workflows/android.yml
