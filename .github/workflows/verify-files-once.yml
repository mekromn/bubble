name: Verify current Bubble changes
# Emulator time is deliberately scoped to current work, not an ever-growing historical suite.
# The signed ARM64 APK is published immediately after compile/signing; emulator/runtime verification
# continues afterward and upgrades the same release from EARLY manual-test to verified when green.
#
# RAW GECKODISPLAY SURFACEVIEW FAST PATH — BUILD 105 STABILITY BASELINE:
# - Floating uses GeckoSession.acquireDisplay() -> raw top-Z SurfaceView in its page-only overlay.
# - No TextureView. Gecko accessibility is hosted on the attached page FrameLayout/ViewParent.
# - Fullscreen remains normal GeckoView/SurfaceView. Resident ChatGPT and Google Voice tabs stay
#   active/high priority. App Zygote remains off and Gecko runtime settings stay at Build-84 baseline.
# - Blur remains one masked service-owned compositor window and only covers native chrome.
#
# REFRESH RATE:
# - Bubble uses a pure refresh-rate policy: preferredDisplayModeId is cleared and preferredRefreshRate
#   requests the highest supported same-resolution rate on every Bubble window.
# - Raw/fullscreen SurfaceView producers receive Surface.setFrameRate() once per Surface life;
#   Android 16 uses FRAME_RATE_COMPATIBILITY_AT_LEAST for UI/scroll/fling.
#
# PAGE APPEARANCE:
# - Per-tab modes are Bubble default / Force dark / AMOLED black / Force light.
# - AMOLED uses true #000000 primary/retinted surfaces.
# - Native port + one-shot appearance handshakes run in parallel and re-verify on pageshow/focus/
#   visibility restore so Refresh cannot strand a tab on the website's default theme.
#
# GOOGLE VOICE EXTENSION 3.0 + RICH NOTIFICATIONS:
# - Active-header copy icon resolves only the current header/call metadata and re-resolves on tap.
# - voice-dark.js fixes isolated bright controls/popups/inputs; AMOLED keeps primary Voice surfaces black.
# - Android Voice alerts use Person/MessagingStyle, contact initial/avatar, phone number and full message.
# - Gecko WebNotification.imageUrl upgrades the contact avatar when available without a second alert.
# - Missing phone numbers can be enriched locally from explicit metadata on the matching Voice row.
# - A notification tap first activates the exact resident Voice tab, then fires WebNotification.click().
# - GeckoRuntime ServiceWorkerDelegate routes clients.openWindow(messageUrl) into that exact tab.
# - voice-route.js is the final local fallback, scoring rows by phone/contact/message and selecting the
#   specific conversation if Google's own notificationclick/openWindow path does not navigate it.
# - Arbitrary message-body phone numbers are never treated as sender identity; only title/tag/explicit
#   sender fragments or verified Voice row/header metadata may supply the contact phone number.
#
# Persistent crash diagnostics remain implemented but DiagnosticLog.ENABLED=false.
on:
  push:
    branches: [rebuild-v2]
    paths: ['.github/workflows/verify-files-once.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    if: github.repository == 'mekromn/bubble' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[verify-files]'))
    uses: ./.github/workflows/android.yml
