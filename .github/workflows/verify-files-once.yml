name: Verify current Bubble changes
# Build-115-derived direct SurfaceControl A/B.
#
# ONLY INTENDED RENDERING DELTA:
# - Fullscreen remains the exact Build 115 GeckoView path.
# - Floating keeps the exact Build 115 GeckoSession/runtime/APZ policy.
# - Floating webpage buffers no longer use SurfaceView as the producer host.
# - GeckoDisplay is published a Surface constructed directly from an app-owned SurfaceControl.
# - The SurfaceControl is reparented to the page overlay Window root through AttachedSurfaceControl.
# - A plain View remains only for touch, keyboard/IME and Gecko accessibility hosting.
# - The direct Surface keeps the same maximum refresh-rate vote used by Build 115.
# - No TextureView, bitmap copy/readback, App Zygote, Gecko pref, notification, theme or Voice change.
# - Source guards now explicitly require the direct SurfaceControl producer rather than SurfaceView.
#
# This workflow intentionally runs only on the isolated zero-copy branch so rebuild-v2 stays untouched.
on:
  push:
    branches: [zero-copy-build115]
    paths: ['.github/workflows/verify-files-once.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    if: github.repository == 'mekromn/bubble' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[verify-files]'))
    uses: ./.github/workflows/android.yml
