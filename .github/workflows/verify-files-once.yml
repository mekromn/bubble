name: Verify current Bubble changes
# Emulator time is deliberately scoped to the feature being changed now, not an ever-growing
# historical regression queue. Previously-proven file transfer, page appearance, pill gestures,
# readiness colors and the accepted floating -> fullscreen clip reveal remain in source coverage but
# are not part of this build's emulator gate.
#
# Current gate: fullscreen -> floating only. The Pixel recording showed the old screenshot morph was
# conceptually correct but visually wrong in two ways: the 4MP screenshot was being redrawn into a
# changing Rect every frame, and the live floating Gecko viewport cross-faded in while that screenshot
# was still moving, producing obvious double/ghost content after the live page reflowed. The new path
# uploads the snapshot once to a hardware layer and moves it with compositor translation/scale only.
# The screenshot stays fully opaque for the entire geometry morph, lands exactly on the saved floating
# rectangle, holds for one display frame, then performs only a very short stationary dissolve into the
# already-rendering live card. Headless SwiftShader cannot expose Gecko compositor pixels reliably, so
# CI validates allocation, overlay attach, morph start, final card visibility and workspace continuity;
# the Pixel remains the visual-fidelity oracle. Floating -> fullscreen is intentionally unchanged.
on:
  push:
    branches: [rebuild-v2]
    paths: ['.github/workflows/verify-files-once.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    if: github.repository == 'mekromn/bubble' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[verify-files]'))
    uses: ./.github/workflows/android.yml