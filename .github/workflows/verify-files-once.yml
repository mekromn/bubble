name: Verify current Bubble changes
# Emulator time is deliberately scoped to the feature being changed now, not an ever-growing
# historical regression queue. Previously-proven file transfer, page appearance, pill gestures,
# readiness colors and the accepted floating -> fullscreen clip reveal remain in source coverage but
# are not part of this build's emulator gate.
#
# Current gate: fullscreen -> floating only. Bubble freezes the exact fullscreen browser before Gecko
# changes window owners. Window PixelCopy captures the real Activity surface while Gecko capturePixels
# separately supplies the SurfaceView webpage pixels with bounded retries, preventing a root.draw()
# screenshot from preserving a black SurfaceView hole. The floating overlay is already at its exact
# final layout; one screenshot stretches into those saved bounds and cross-fades into the live card
# only at the end. The reverse floating -> fullscreen direction intentionally remains the previously
# accepted Android clip-reveal path.
on:
  push:
    branches: [rebuild-v2]
    paths: ['.github/workflows/verify-files-once.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    if: github.repository == 'mekromn/bubble' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[verify-files]'))
    uses: ./.github/workflows/android.yml