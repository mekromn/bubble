name: Verify browser file transfers
# Consolidated verification: real SAF uploads/downloads, parked restore, compact refresh/share chrome,
# adaptive ChatGPT tab suspension/force-keep-alive, and matched floating/fullscreen/minimize motion.
on:
  push:
    branches: [rebuild-v2]
    paths: ['.github/workflows/verify-files-once.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    if: github.repository == 'mekromn/bubble' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[verify-files]'))
    uses: ./.github/workflows/android.yml
