name: Verify current Bubble changes
# Emulator time is deliberately scoped to current work, not an ever-growing historical suite.
# The signed ARM64 APK is published immediately after compile/signing; emulator/runtime verification
# continues afterward and upgrades the same release from EARLY manual-test to verified when green.
#
# Current verification covers Continuity Vault/full-history sync, Archive-all-open-chats, long-press
# New Chat continuation, transcript command automation, Google Voice notification/UI enhancements,
# resident/high-priority tab policy, and the floating-browser hybrid performance path.
#
# RAW GECKODISPLAY SURFACEVIEW FAST PATH — BUILD 101 PHYSICAL-PIXEL BASELINE:
# - Gecko runtime behavior matches the known-fast Build 84 baseline: remote debugging and console-to-
#   Logcat output are disabled; every other Gecko runtime setting stays at Gecko default. No App
#   Zygote and no accumulated speculative Gecko feature disables.
# - Fullscreen remains normal GeckoView/SurfaceView.
# - Floating rendering bypasses GeckoView's display backend entirely. A plain Android SurfaceView owns
#   the page window and GeckoSession.acquireDisplay() feeds its Surface + SurfaceControl directly to
#   GeckoDisplay.surfaceChanged(SurfaceInfo).
# - The raw SurfaceView is setZOrderOnTop(true) BEFORE attachment inside its dedicated page-only opaque
#   overlay. This is required on the Pixel 9 Pro XL: Build 101 is the first no-TextureView raw-display
#   build physically verified to render both ChatGPT and Google Voice in floating mode.
# - Workspace compatibility uses a tiny GeckoView-shaped bookkeeping adapter, deliberately DETACHED:
#   it is never inserted into an Android View tree or attached to a Window. There is no floating
#   TextureView rendering path.
# - Raw display teardown happens before its Android Surface window is removed, and async SurfaceHolder
#   publication failures are caught/unwound so a handoff race cannot terminate the process.
# - Raw touch goes to PanZoomController; IME/key input goes to SessionTextInput; accessibility motion
#   is forwarded to SessionAccessibility. Gecko can request a replacement Surface through the supplied
#   GeckoDisplay.NewSurfaceProvider implementation.
# - The raw page SurfaceView lives in its own PixelFormat.OPAQUE hardware-accelerated
#   TYPE_APPLICATION_OVERLAY window physically bounded between the 52dp header and 48dp footer.
# - FloatingWindow remains the single geometry authority. The page sibling follows move/resize, and
#   GeckoDisplay receives screen-origin updates whenever the page window moves.
# - Floating glass remains one service-owned backdrop window matching Build 84's low layer count, with
#   CHAT masked to top/bottom native chrome only. Current resident active/high-priority behavior stays.
#
# PHYSICAL-DEVICE CRASH DIAGNOSTICS:
# - DiagnosticLog installs from BubbleApp before GeckoRuntime/Workspace creation.
# - Low-overhead breadcrumbs are queued off the UI thread and mirrored to an app-owned MediaStore file
#   under Downloads/Bubble Logs plus a private shadow file.
# - Workspace traces select -> ensureSession -> newSession -> session.open -> load/restore -> surface
#   handoff, including targetHadSession before ensureSession so never-before-opened tabs are explicit.
# - Normal LiveGeckoView fullscreen set/release ownership is traced as well as RawSessionBridge,
#   GeckoDisplay acquire/release, Surface create/change/destroy/publish, input binding, page-window
#   attach/remove and selected-tab/session identity. This distinguishes tabs that previously owned a
#   fullscreen display from first-display tabs opened directly from the floating chooser.
# - Logs never include page contents, cookies, auth headers, tokens or URL query strings.
# - Uncaught Java/Kotlin exceptions force-flush the breadcrumb tail plus stack and thread dump.
# - Android 11+ ApplicationExitInfo is recorded on next launch so native Gecko crashes, signals, ANRs,
#   low-memory kills and other process deaths remain diagnosable even when Java cannot catch them.
#
# Credentials never cross to the isolated/native Vault bridge. Existing focused UI/Vault/archive/
# dialog/transition gates remain.
on:
  push:
    branches: [rebuild-v2]
    paths: ['.github/workflows/verify-files-once.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    if: github.repository == 'mekromn/bubble' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[verify-files]'))
    uses: ./.github/workflows/android.yml
