name: Verify current Bubble changes
# Emulator time is deliberately scoped to current work, not an ever-growing historical suite.
# Archive Picker passed build 62. The aspect-preserving screenshot morph is still current transition
# work and remains the Android runtime gate until its Pixel behavior is accepted.
#
# This build also upgrades Your Chats from a coarse live/working/ready model to semantic status:
# attention, generating, page-loading with real progress, reply-ready, protected Voice, active,
# forced-live, idle/15-minute-hibernation eligibility, and suspended. Unit coverage validates status
# priority and distinct visual identities; the chooser renders a matching colored status dot plus the
# already-strong selected-tab fill/edge/active marker.
on:
  push:
    branches: [rebuild-v2]
    paths: ['.github/workflows/verify-files-once.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    if: github.repository == 'mekromn/bubble' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[verify-files]'))
    uses: ./.github/workflows/android.yml
