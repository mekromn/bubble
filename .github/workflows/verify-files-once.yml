name: Verify current Bubble changes
# Emulator time is deliberately scoped to current work, not an ever-growing historical suite.
# The signed ARM64 APK is now published immediately after compile/signing; emulator/runtime verification
# continues afterward and upgrades the same release from EARLY manual-test to verified when green.
# Archive Picker passed build 62. The aspect-preserving screenshot morph remains the current
# transition regression gate.
#
# Current verification covers cumulative Continuity Vault merging, explicit same-origin full-history
# sync, Archive-all-open-chats, long-press New Chat continuation, any-running-tab transcript command
# automation, the continuity-first companion skill contract, two-check 30-minute idle tab
# maintenance, the output-driven 30-minute generation-stall watchdog, the GitHub download-tab fix,
# Google Voice notification/UI enhancements, and the corrected floating-browser direct-compositor
# speed path. Full-history sync follows the supplied Continuity Vault CRX flow. New-chat continuity
# stages the exact source chat and attaches its complete native Markdown transcript in the fresh
# ChatGPT composer; the 70k text handoff is fallback-only. Both continuation and GET_CHAT_TRANSCRIPT
# prefer ChatGPT's generic #upload-files control, reject photo/camera-only inputs, and use bounded
# drop/paste fallbacks. Google Voice notifications promote detected contact names, retain phone
# numbers as secondary context, expose a Copy number Android action, and an exact voice.google.com
# top-frame script adds a one-tap copy-number control immediately before the existing call button.
# The bundled Gecko extension is version 2.6 so ensureBuiltIn upgrades profiles that still have the
# pre-Voice-UI 2.5 package.
#
# Floating CHAT hard-locks GeckoView to SurfaceView even if an older caller requests TextureView,
# retains hardware acceleration and maximum-refresh voting, preserves the existing resident active/
# high-priority tab policy, and limits cross-window blur to the native 52dp header and 48dp footer.
# The rendered Gecko page is never a blur target. UI blur remains live during drag/resize; its
# shape/radius/geometry state is cached to avoid unnecessary allocations and redundant compositor
# configuration in the motion hot path.
# Credentials never cross to the isolated/native Vault bridge. Existing focused UI/Vault/archive/
# dialog/transition gates remain.
on:
  push:
    branches: [rebuild-v2]
    paths: ['.github/workflows/verify-files-once.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    if: github.repository == 'mekromn/bubble' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[verify-files]'))
    uses: ./.github/workflows/android.yml
