name: Verify browser file transfers
# Consolidated verification for unrestricted attachment selection, no-stale ChatGPT resume,
# five-minute idle ChatGPT suspension grace, shape-clipped Window background blur only (never
# screen-wide blur-behind), continuous glass during drag/resize/animation, circular resting-bubble
# glass, adjustable bubble opacity, drag-to-reorder tab order, shared Android notification health,
# high-visibility ChatGPT reply alerts, protected Google Voice channels with real Voice
# visibility/focus semantics, plus the native Google Voice unread-title fallback for cases where
# voice.google.com updates its tab title but emits zero Gecko Web Notification events.
# Also verifies persistent per-tab Bubble-default/Force-dark/Force-light webpage presentation,
# including late-rendering light SPAs such as Google Voice without observer feedback loops and with
# a resilient content-script/native appearance handshake that retries invalid one-shot responses
# and falls back to connectNative instead of silently treating a missed delegate as DEFAULT.
# Independently persisted floating-chat and chooser geometry, symmetric chooser list insets,
# readiness-colored tab cards, current/last-tab reveal in both switchers, and the shared bottom pill
# are also covered. Floating webpage pill: left=Back, right=Forward, up=Your chats, down=minimize.
# Your-chats pill: up=return to last tab, down=minimize. Fullscreen-to-floating no longer scales an
# opaque Activity root (which exposed a black backing surface); the overlay uses fixed-bounds
# translucent settle motion instead. The exact observed title form "Voice - (1) Messages" remains
# regression-tested. API-31 blur calls remain runtime-gated on the min-26 app. Runtime failure still
# publishes a clearly marked UNVERIFIED ARM64 APK when compilation/signing succeeds.
on:
  push:
    branches: [rebuild-v2]
    paths: ['.github/workflows/verify-files-once.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    if: github.repository == 'mekromn/bubble' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[verify-files]'))
    uses: ./.github/workflows/android.yml
