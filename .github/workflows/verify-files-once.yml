name: Verify browser file transfers
# Consolidated verification using exact Gecko accessibility screen geometry followed by real injected touches, a MAIN-world Blob ownership hook plus isolated native bridge, and isolated runtime groups. Runtime failure still publishes a clearly marked UNVERIFIED ARM64 APK when compilation/signing succeeds so physical-device validation can continue.
on:
  push:
    branches: [rebuild-v2]
    paths: ['.github/workflows/verify-files-once.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    if: github.repository == 'mekromn/bubble' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[verify-files]'))
    uses: ./.github/workflows/android.yml
