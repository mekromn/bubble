name: Verify browser file transfers
# Consolidated verification for unrestricted openable attachment selection, no-stale ChatGPT resume,
# translucent/cross-window-blurred glass, adjustable resting-bubble opacity, drag-to-reorder tab order,
# and the existing file/session/profile/floating/edge runtime gates. Runtime failure still publishes
# a clearly marked UNVERIFIED ARM64 APK when compilation/signing succeeds so physical-device validation can continue.
on:
  push:
    branches: [rebuild-v2]
    paths: ['.github/workflows/verify-files-once.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    if: github.repository == 'mekromn/bubble' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[verify-files]'))
    uses: ./.github/workflows/android.yml
