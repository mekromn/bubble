name: Verify current Bubble changes
# Emulator time is deliberately scoped to the feature being changed now, not an ever-growing
# historical regression queue. Previously-proven file transfer, page appearance, pill gestures,
# readiness colors and the accepted floating -> fullscreen clip reveal remain in source coverage but
# are not part of this build's emulator gate.
#
# Current gate: fullscreen -> floating only. The newest Pixel recording exposed two real-device-only
# defects that the previous mechanical gate could not see: the geometry morph could start as soon as
# BrowserActivity lost focus even though its old surface was still visibly present underneath, and the
# short stationary alpha dissolve still blended two differently-reflowed page layouts into a ghosted
# double image. The frozen fullscreen frame now remains pinned/opaque through that task-removal gap,
# stays the only visible moving image for the complete trajectory, then lands at the exact saved card
# rectangle. At the endpoint the real card is made fully opaque behind the still-opaque screenshot for
# one complete display frame; the screenshot disappears on the following vsync with no alpha blending.
# CI validates the handoff mechanics/session continuity/final geometry. Pixel hardware remains the
# visual-fidelity oracle. Floating -> fullscreen is intentionally unchanged.
on:
  push:
    branches: [rebuild-v2]
    paths: ['.github/workflows/verify-files-once.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    if: github.repository == 'mekromn/bubble' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[verify-files]'))
    uses: ./.github/workflows/android.yml