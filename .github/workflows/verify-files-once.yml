name: Verify current Bubble changes
# Emulator time is deliberately scoped to the feature being changed now, not an ever-growing
# historical regression queue. Archive Picker passed build 62 and remains in source coverage.
#
# Current gate: fullscreen -> floating. The latest Pixel recording showed that the screenshot bridge
# still looked synthetic because width and height were scaled independently as the fullscreen aspect
# ratio became the floating-card aspect ratio. Build 63 keeps one uniform compositor scale and changes
# only the visible crop while following the exact destination rectangle, so text/icons keep their
# proportions instead of visibly squashing. Endpoint remains a no-alpha, two-vsync handoff to live
# Gecko. Floating -> fullscreen is intentionally unchanged.
on:
  push:
    branches: [rebuild-v2]
    paths: ['.github/workflows/verify-files-once.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    if: github.repository == 'mekromn/bubble' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[verify-files]'))
    uses: ./.github/workflows/android.yml
