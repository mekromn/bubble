name: Verify current Bubble changes
# Emulator time is deliberately scoped to the features being changed now, not an ever-growing
# historical regression queue. Previously-proven file-transfer and older appearance regressions
# remain in source but are no longer part of every build's emulator gate.
#
# Current gate: floating-window chrome/gesture behavior plus the Google Voice mixed-theme Force
# Dark fix and the true matched fullscreen <-> floating morph. The transition captures native chrome
# and Gecko compositor pixels before surface ownership changes, puts that exact frame in one shared
# transparent overlay, and morphs one visible card continuously through position, size, corner radius,
# content reflow and surface opacity. The floating destination becomes genuinely translucent before
# overlay removal, so glass/background visibility is part of the same morph. A one-use recent
# fullscreen visual seed protects immediate reversal from the SurfaceView/TextureView buffer race.
# Floating ownership is published synchronously while obsolete overlay destruction is deferred one
# main-loop turn so BrowserActivity can take the same GeckoSession first. Snapshot work is bounded,
# and floating native chrome capture now suppresses the Gecko TextureView while View.draw runs, then
# composites Gecko's capture separately; a short focus-settle beat lets the new focusable overlay
# process WindowManager input before any snapshot work. This avoids redundant TextureView raster work
# and prevents capture from starving a FocusEvent on slow renderers. Runtime performs a complete
# fullscreen -> floating -> fullscreen -> floating round trip and checks a real system screenshot near
# each handoff midpoint. Google Voice mixed-theme Force Dark remains the other current runtime gate.
on:
  push:
    branches: [rebuild-v2]
    paths: ['.github/workflows/verify-files-once.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    if: github.repository == 'mekromn/bubble' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[verify-files]'))
    uses: ./.github/workflows/android.yml
