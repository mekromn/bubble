name: Verify current Bubble changes
# Emulator time is deliberately scoped to the features being changed now, not an ever-growing
# historical regression queue. Previously-proven file-transfer and older appearance regressions
# remain in source but are no longer part of every build's emulator gate.
#
# Current gate: floating-window chrome/gesture behavior plus the Google Voice mixed-theme Force
# Dark fix and the new true matched fullscreen <-> floating morph. The handoff now captures the
# exact source pixels before Gecko changes surface ownership, places that frame in one transparent
# system overlay, and animates that single visible card continuously through position, size, corner
# radius and destination-frame dissolve. The real destination is hidden underneath until its bounds
# exactly match, preventing black backing flashes, double-card reads and independent-window timing.
# Floating -> fullscreen grows that same held card to the display before BrowserActivity is launched
# behind it, then PixelCopies the real destination and dissolves only at identical full-screen bounds.
# Re-run after correcting the compositor scheduling boundary so the matched morph compiles cleanly.
on:
  push:
    branches: [rebuild-v2]
    paths: ['.github/workflows/verify-files-once.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    if: github.repository == 'mekromn/bubble' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[verify-files]'))
    uses: ./.github/workflows/android.yml
