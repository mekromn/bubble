name: Verify current Bubble changes
# Build-115-derived combined native buffer experiment.
#
# ONLY INTENDED RENDERING DELTA:
# - Fullscreen remains the exact Build 115 GeckoView path.
# - Floating keeps the exact Build 115 GeckoSession/runtime/APZ/input policy.
# - Gecko renders into an AImageReader-owned ANativeWindow.
# - Producer BufferQueue is forced to shared-buffer + auto-refresh front-buffer mode.
# - Allocations require FRONT_BUFFER + COMPOSER_OVERLAY + GPU_FRAMEBUFFER + GPU_SAMPLED_IMAGE.
# - Shared-buffer consumer is actively polled every VSYNC because auto-refresh permits acquisition
#   even when no ordinary onImageAvailable callback was delivered.
# - The exact acquired frame is submitted as the same AHardwareBuffer, 1:1 and unscaled, to ASurfaceControl.
# - SurfaceFlinger release fence is returned to AImageReader via AImage_deleteAsync.
# - No SurfaceView/TextureView floating producer, CPU buffer lock/readback, memcpy, texture blit or fidelity drop.
# - Android 16/API 36 is deliberately required; there is no fallback so physical A/B is unambiguous.
# - HWC plane assignment is requested through COMPOSER_OVERLAY/FRONT_BUFFER eligibility; SurfaceFlinger/HWC remains final arbiter.
# - Native build uses NDK r30; LL-NDK shared-buffer controls are runtime-resolved from device libnativewindow.
# - AttachedSurfaceControl parenting is deferred/retried on VSYNC.
# - Persistent DiagnosticLog remains ENABLED and now records pump/no-buffer/error/submission states.
#
# No notification/theme/Voice feature changes are part of this branch.
# Verification trigger: compile VSYNC-driven shared-buffer consumer pump.
on:
  push:
    branches: [anw-ahb-build115]
    paths: ['.github/workflows/verify-files-once.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    if: github.repository == 'mekromn/bubble' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[verify-files]'))
    uses: ./.github/workflows/android.yml
