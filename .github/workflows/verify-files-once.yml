name: Verify current Bubble changes
# Emulator time is deliberately scoped to current work, not an ever-growing historical suite.
# The signed ARM64 APK is published immediately after compile/signing; emulator/runtime verification
# continues afterward and upgrades the same release from EARLY manual-test to verified when green.
#
# Current verification covers Continuity Vault/full-history sync, Archive-all-open-chats, long-press
# New Chat continuation, transcript command automation, Google Voice notification/UI enhancements,
# resident/high-priority tab policy, and the floating-browser hybrid performance path.
#
# HYBRID PERFORMANCE BASELINE:
# - Gecko runtime behavior is restored to the known-fast Build 84 baseline: remote debugging and
#   console-to-Logcat output are disabled; every other Gecko runtime setting stays at Gecko default.
#   No App Zygote and no accumulated speculative Gecko feature disables.
# - Fullscreen uses Gecko SurfaceView.
# - Floating CHAT also uses Gecko SurfaceView: the historical TextureView request is intercepted before
#   attachment, Gecko's SurfaceView backend is created instead, and the internal SurfaceView is promoted
#   with setZOrderOnTop(true) before TYPE_APPLICATION_OVERLAY attachment. No Gecko TextureView is created.
# - Floating glass is collapsed back from two compositor Dialogs to one service-owned backdrop window,
#   matching Build 84's low layer count. CHAT uses a top/bottom alpha mask matching the 52dp header and
#   48dp footer, leaving the rendered page center visually blur-free. Glass stays live during move/resize.
# - Hardware acceleration, maximum-refresh voting, current resident active/high-priority behavior, all
#   current Continuity/Voice features, profile isolation and security invariants remain unchanged.
#
# Credentials never cross to the isolated/native Vault bridge. Existing focused UI/Vault/archive/
# dialog/transition gates remain.
on:
  push:
    branches: [rebuild-v2]
    paths: ['.github/workflows/verify-files-once.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    if: github.repository == 'mekromn/bubble' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[verify-files]'))
    uses: ./.github/workflows/android.yml
