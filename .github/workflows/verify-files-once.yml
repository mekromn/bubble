name: Verify current Bubble changes
# Build-115-derived combined native buffer experiment.
#
# ONLY INTENDED RENDERING DELTA:
# - Fullscreen remains the exact Build 115 GeckoView path.
# - Floating keeps the exact Build 115 GeckoSession/runtime/APZ/input policy.
# - Gecko renders into an AImageReader-owned ANativeWindow.
# - The consumer acquires that exact frame as AHardwareBuffer with its acquire fence.
# - The same AHardwareBuffer is submitted to ASurfaceControl via setBufferWithRelease.
# - The SurfaceFlinger release fence is returned to AImageReader via AImage_deleteAsync.
# - No SurfaceView/TextureView floating producer, CPU buffer lock, readback, memcpy or fidelity drop.
# - Android 16/API 36 is deliberately required; this branch has no fallback so physical A/B is clean.
# - Native diagnostics remain quiet; existing DiagnosticLog remains implemented and disabled.
#
# No notification/theme/Voice feature changes are part of this branch.
on:
  push:
    branches: [anw-ahb-build115]
    paths: ['.github/workflows/verify-files-once.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    if: github.repository == 'mekromn/bubble' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[verify-files]'))
    uses: ./.github/workflows/android.yml
