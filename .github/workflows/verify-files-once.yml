name: Verify current Bubble changes
# Emulator time is deliberately scoped to current work, not an ever-growing historical suite.
# The signed ARM64 APK is published immediately after compile/signing; emulator/runtime verification
# continues afterward and upgrades the same release from EARLY manual-test to verified when green.
#
# Current verification covers Continuity Vault/full-history sync, Archive-all-open-chats, long-press
# New Chat continuation, transcript command automation, Google Voice notification/UI enhancements,
# resident/high-priority tab policy, and the floating-browser hybrid performance path.
#
# RAW GECKODISPLAY SURFACEVIEW FAST PATH — BUILD 105 STABILITY BASELINE:
# - Gecko runtime behavior matches the known-fast Build 84 baseline: remote debugging and console-to-
#   Logcat output are disabled; every other Gecko runtime setting stays at Gecko default. No App
#   Zygote and no accumulated speculative Gecko feature disables.
# - Fullscreen remains normal GeckoView/SurfaceView.
# - Floating rendering bypasses GeckoView's display backend entirely. A plain Android SurfaceView owns
#   the page window and GeckoSession.acquireDisplay() feeds its Surface + SurfaceControl directly to
#   GeckoDisplay.surfaceChanged(SurfaceInfo).
# - The raw SurfaceView is setZOrderOnTop(true) BEFORE attachment inside its dedicated page-only opaque
#   overlay. This is required on the Pixel 9 Pro XL; no TextureView is used.
# - Gecko accessibility is hosted on the attached page FrameLayout/ViewParent, never the SurfaceView.
#   Build 105 physically fixed the SessionAccessibility ViewParent tab-switch crash.
# - Raw display teardown happens before its Android Surface window is removed; touch still goes straight
#   to PanZoomController and IME/key input goes straight to SessionTextInput.
# - The raw page SurfaceView remains PixelFormat.OPAQUE and hardware accelerated.
# - Floating glass remains one masked service-owned backdrop window, with blur only on native chrome.
#
# SPEED BUILD — FULL COMPOSITOR HIGH-REFRESH CONTRACT:
# - Fullscreen, floating native chrome, raw Gecko page, and the independent live-glass backdrop all
#   select/request the highest supported same-resolution display mode.
# - Android 15+ setRequestedFrameRate(maxRate) is applied recursively because ViewGroup requests do not
#   propagate automatically to child Views.
# - Every real SurfaceView producer gets a Surface.setFrameRate() contract once per Surface lifetime.
# - Android 16 uses FRAME_RATE_COMPATIBILITY_AT_LEAST for UI/scroll/fling producer surfaces.
# - Android 15+ touch frame-rate boost is explicitly enabled for Bubble windows.
# - Android 15+ frame-rate power-savings-balanced policy is disabled to favor smoothness over power.
# - Surface frame-rate hints are never spammed on every frame or resize callback.
# - Persistent crash diagnostics remain fully implemented but DiagnosticLog.ENABLED=false for this
#   performance build: no Downloads logger, writer thread, PSS sampling, or diagnostic tab scans.
#
# Credentials never cross to the isolated/native Vault bridge. Existing focused UI/Vault/archive/
# dialog/transition gates remain.
on:
  push:
    branches: [rebuild-v2]
    paths: ['.github/workflows/verify-files-once.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    if: github.repository == 'mekromn/bubble' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[verify-files]'))
    uses: ./.github/workflows/android.yml
