name: Verify profile-isolation update
# Consolidated retry after explicit lifecycle synchronization in the notification UI test.
# Routine source edits do not run CI. This does not add any Actions artifact uploads.
on:
  push:
    branches: [rebuild-v2]
    paths: ['.github/workflows/verify-profiles-once.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    if: github.repository == 'mekromn/bubble' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[verify-profiles]'))
    uses: ./.github/workflows/android.yml
