name: Bubble 141 production windowed arena
on:
  workflow_dispatch:
  push:
    branches: [windowed-ab-benchmark141]
    paths: ['app/**', 'tools/**', 'docs/BUILD141_WINDOWED_ARENA.md', '.github/workflows/windowed-benchmark141.yml', 'build.gradle.kts', 'settings.gradle.kts', 'gradle.properties']
permissions:
  contents: write
concurrency:
  group: bubble-windowed-arena141
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Materialize reviewed benchmark source once and pin scope
        run: |
          set -euo pipefail
          if [ -f .staging/windowed141.patch.b64 ]; then
            base64 -d .staging/windowed141.patch.b64 > /tmp/windowed141.patch.xz
            echo 'c56067dc91a488074370acd561c131a1d8cac783351c9c99dfe791e444c68230  /tmp/windowed141.patch.xz' | sha256sum -c -
            xz -dc /tmp/windowed141.patch.xz > /tmp/windowed141.patch
            echo '17543a0277adc7f03d09e7a92ebd9fd64c82c84117c75c87606f00307bdc3fbe  /tmp/windowed141.patch' | sha256sum -c -
            git apply --check /tmp/windowed141.patch
            git apply /tmp/windowed141.patch
            git rm .staging/windowed141.patch.b64
            git add app tools docs
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'bench(windowed): add blinded production 139-vs-140 arena with real child presentation telemetry'
            git push origin HEAD:windowed-ab-benchmark141
          fi
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git diff --exit-code e6597800097796a9b149b9cb19f14deffe0be3cb HEAD -- app/src/main/assets app/src/main/AndroidManifest.xml app/src/performance app/proguard-performance.pro app/signing
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Source invariants, benchmark scope and native lifetime tests
        env:
          CXX: clang++
        run: |
          set -euo pipefail
          node tools/test-foreground.cjs | tee foreground-tests.txt
          node tools/test-page-input.cjs | tee page-input-source-checks.txt
          node tools/test-windowed-benchmark.cjs | tee benchmark-source-checks.txt
          node tools/test-fast-build.cjs
          node tools/test-hardware-policy.cjs
          node tools/test-embedded-page.cjs | tee embedded-source-checks.txt
          bash tools/test-relay-native.sh | tee native-unit-tests.txt
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
          cache-read-only: false
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-37.1' 'build-tools;36.0.0'
      - name: Build optimized same-identity ARM64 arena
        run: |
          set -euo pipefail
          echo '4a907a5d115b37e1ea77bc2d744c165e6c3afa4d1aa2faa4762f7d6e1f8d3151  app/signing/bubble-debug.jks' | sha256sum -c -
          gradle --no-daemon :app:testPerformanceUnitTest :app:assemblePerformance :app:lintPerformance 2>&1 | tee fast-build.txt
          mkdir -p dist
          cp app/build/outputs/apk/performance/app-performance.apk dist/Bubble-141-WINDOWED-ARENA-ARM64.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs dist/*.apk > dist/signature.txt
          grep -q '001a6f40ddcff14aec3aca71964fec58c29a32bdd0c649285bce60ae940c2b1f' dist/signature.txt
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest print dist/*.apk > dist/AndroidManifest.xml
          python3 - <<'PY'
          import json, xml.etree.ElementTree as ET
          from pathlib import Path
          root=ET.parse('dist/AndroidManifest.xml').getroot();ns='{http://schemas.android.com/apk/res/android}'
          assert root.attrib['package']=='com.mekromn.bubble.debug'
          assert root.attrib[ns+'versionCode']=='141'
          app=root.find('application');assert app.attrib.get(ns+'debuggable','false')=='false'
          assert app.find('profileable').attrib[ns+'shell']=='true'
          assert app.attrib.get(ns+'hardwareAccelerated')=='true'
          flags=[]
          for path in Path('app/.cxx').rglob('compile_commands.json'):
              for entry in json.loads(path.read_text()):
                  if entry['file'].endswith('bubble_ahb.cpp'):
                      command=entry.get('command',' '.join(entry.get('arguments',[])))
                      if '-O3' in command and '-flto=thin' in command: flags.append(command)
          assert flags,'Native optimized compile flags missing'
          Path('dist/NATIVE_FLAGS.txt').write_text('\n'.join(flags))
          PY
          python3 tools/audit-hardware-apk.py dist/Bubble-141-WINDOWED-ARENA-ARM64.apk --out dist/HARDWARE_AUDIT.json
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" dex code --class com.mekromn.bubble.PageTouchDispatch dist/*.apk > dist/PageTouchDispatch.smali
          grep -q requestUnbufferedDispatch dist/PageTouchDispatch.smali
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" dex code --class com.mekromn.bubble.WindowedBenchmark dist/*.apk > dist/WindowedBenchmark.smali
          grep -q 'Bubble Benchmarks' dist/WindowedBenchmark.smali
          unzip -p dist/Bubble-141-WINDOWED-ARENA-ARM64.apk lib/arm64-v8a/libbubble-ahb.so > /tmp/libbubble-ahb.so
          strings /tmp/libbubble-ahb.so | grep -q nativeBenchmarkSnapshot
          cp docs/BUILD141_WINDOWED_ARENA.md native-unit-tests.txt embedded-source-checks.txt page-input-source-checks.txt benchmark-source-checks.txt dist/
          cp -r app/build/outputs/mapping/performance dist/r8-mapping
          sha256sum dist/*.apk > dist/SHA256SUMS
          git rev-parse HEAD > dist/SOURCE.txt
          git archive HEAD -- . ':!app/signing' | gzip > dist/source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: bubble-windowed-arena141-arm64
          path: dist/
          retention-days: 7
      - name: Build same optimized type for Android correctness test
        run: |
          set -euo pipefail
          gradle --no-daemon -PgeckoAbi=x86_64 :app:assemblePerformance :app:assemblePerformanceAndroidTest 2>&1 | tee fast-emulator-build.txt
      - run: sudo chmod a+rw /dev/kvm
      - name: Production renderer/window/input regression gate
        id: runtime
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: default
          profile: pixel_2
          ram-size: 3072M
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save
          script: |
            adb shell wm size 720x1280
            adb shell wm density 280
            sleep 20
            adb install -r app/build/outputs/apk/performance/app-performance.apk
            adb install -r app/build/outputs/apk/androidTest/performance/app-performance-androidTest.apk
            adb logcat -c
            timeout 300s adb shell am instrument -w -e class com.mekromn.bubble.RelayLatestBpRuntimeTest com.mekromn.bubble.debug.test/androidx.test.runner.AndroidJUnitRunner > fast-runtime.txt 2>&1 || true
            adb logcat -d > fast-logcat.txt
            adb pull /sdcard/Android/data/com.mekromn.bubble.debug/files/evidence runtime-evidence || true
            cat fast-runtime.txt
            grep -q 'OK (1 test)' fast-runtime.txt
      - name: Preserve exact correctness result
        if: always() && !cancelled()
        env:
          RUNTIME: ${{ steps.runtime.outcome }}
        run: |
          mkdir -p evidence
          printf 'Android 16 optimized browser correctness: %s\nSource: %s\nThe emulator result is NOT a performance score; physical Pixel A/B data must come from the in-app arena report.\n' "$RUNTIME" "$SOURCE_COMMIT" > evidence/STATUS.txt
          cp fast-*.txt native-unit-tests.txt embedded-source-checks.txt page-input-source-checks.txt benchmark-source-checks.txt foreground-tests.txt evidence/ 2>/dev/null || true
          cp -r runtime-evidence app/build/reports evidence/ 2>/dev/null || true
          tar -czf windowed-arena141-verification.tar.gz evidence
      - uses: actions/upload-artifact@v4
        if: always() && !cancelled()
        with:
          name: bubble-windowed-arena141-verification
          path: evidence/
          retention-days: 7
      - name: Publish physical-test arena only after correctness gate passes
        if: success() && steps.runtime.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="bubble-windowed-arena-141-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cat > dist/NOTES.md <<EOF
          Bubble 141 — production windowed A/B arena
          Same app/profile/signing identity as 140; non-debuggable R8/native optimized build. Installs over 140.
          In one APK, the real floating page can alternate Build-139 buffered/resampled input and Build-140 gesture-scoped unbuffered input while every renderer/window/engine/relay variable stays fixed. A separate arm tests unbuffered native drag/resize controls.
          The physical arena uses the current real page and actual unified floating window/chrome. No positive confirmation taps and arms are hidden during blocks. It records physical-input arrival/handler metrics, real WindowManager placement age, ImageReader queue pressure/fences and actual child SurfaceControl transaction completion/latch cadence, plus thermal/display context.
          Predefined practical equivalence bounds prevent a fake winner. Reports save to Downloads/Bubble Benchmarks. This APK's default outside a benchmark is Build-140 page input behavior.
          CI validates correctness only; it does not choose a performance winner. No Chromium scrolling engine port or front-buffer experiment is included.
          Source: ${SOURCE_COMMIT}
          EOF
          gh release create "$TAG" dist/*.apk dist/SHA256SUMS dist/SOURCE.txt dist/signature.txt dist/HARDWARE_AUDIT.json dist/benchmark-source-checks.txt windowed-arena141-verification.tar.gz --target "$SOURCE_COMMIT" --title 'Bubble 141 — windowed speed arena' --notes-file dist/NOTES.md --prerelease
