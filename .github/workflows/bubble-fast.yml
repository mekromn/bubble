name: Bubble optimized relay build
on:
  workflow_dispatch:
  push:
    branches: [relay-latest-bp-fast136]
    paths: ['app/**', 'tools/**', '.github/workflows/bubble-fast.yml', 'build.gradle.kts', 'settings.gradle.kts', 'gradle.properties']
permissions:
  contents: write
concurrency:
  group: bubble-fast136
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Materialize reviewed source changes once
        run: |
          set -euo pipefail
          if [ -f tools/build136.patch.xz ]; then
            echo '586bb92c48104b325ccd6e46213eb50b0dec3d8712e93456bc35c236e22385cf  tools/build136.patch.xz' | sha256sum -c -
            xz -dc tools/build136.patch.xz > /tmp/build136.patch
            echo '67a6fb202dacb67d891b3d5a2730f64ac0140083347e2fd0baa762b4811ba926  /tmp/build136.patch' | sha256sum -c -
            git apply --check /tmp/build136.patch
            git apply /tmp/build136.patch
            git rm tools/build136.patch.xz
            git add app tools
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'perf(renderer): optimize build, reuse transaction and leases, coalesce wakes, remove eager diagnostic work'
            git push origin HEAD:relay-latest-bp-fast136
          fi
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Source and native ownership/progress regressions
        run: |
          set -euo pipefail
          node tools/test-foreground.cjs
          node tools/test-fast-build.cjs
          bash tools/test-relay-native.sh | tee native-unit-tests.txt
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
          cache-read-only: false
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-37.1' 'build-tools;36.0.0'
      - name: Build optimized signed ARM64 browser
        id: build
        run: |
          set -euo pipefail
          echo '4a907a5d115b37e1ea77bc2d744c165e6c3afa4d1aa2faa4762f7d6e1f8d3151  app/signing/bubble-debug.jks' | sha256sum -c -
          gradle --no-daemon :app:testPerformanceUnitTest :app:assemblePerformance :app:lintPerformance 2>&1 | tee fast-build.txt
          mkdir -p dist
          cp app/build/outputs/apk/performance/app-performance.apk dist/Bubble-136-relay-latest-bp-FAST-ARM64.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs dist/*.apk > dist/signature.txt
          grep -q '001a6f40ddcff14aec3aca71964fec58c29a32bdd0c649285bce60ae940c2b1f' dist/signature.txt
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest print dist/*.apk > dist/AndroidManifest.xml
          python3 - <<'PY'
          import json, xml.etree.ElementTree as ET
          from pathlib import Path
          root=ET.parse('dist/AndroidManifest.xml').getroot(); ns='{http://schemas.android.com/apk/res/android}'
          assert root.attrib['package']=='com.mekromn.bubble.debug'
          assert root.attrib[ns+'versionCode']=='136'
          app=root.find('application');assert app.attrib.get(ns+'debuggable','false')=='false'
          assert app.find('profileable').attrib[ns+'shell']=='true'
          flags=[]
          for path in Path('app/.cxx').rglob('compile_commands.json'):
              for entry in json.loads(path.read_text()):
                  if entry['file'].endswith('bubble_ahb.cpp'):
                      command=entry.get('command',' '.join(entry.get('arguments',[])))
                      if '-O3' in command and '-flto=thin' in command: flags.append(command)
          assert flags,'Native optimized compile flags missing'
          Path('dist/NATIVE_FLAGS.txt').write_text('\n'.join(flags))
          PY
          cp native-unit-tests.txt dist/
          cp -r app/build/outputs/mapping/performance dist/r8-mapping
          sha256sum dist/*.apk > dist/SHA256SUMS
          git rev-parse HEAD > dist/SOURCE.txt
          git archive HEAD | gzip > dist/source.tar.gz
      - name: Publish optimized candidate with explicit validation boundary
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="bubble-fast-136-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          cat > dist/NOTES.md <<EOF
          Bubble 136 — optimized relay_latest_bp
          Actual browser; non-debuggable, profileable, R8 optimized; our native bridge uses -O3 and ThinLTO.
          Same com.mekromn.bubble.debug package and existing certificate. Update without uninstalling.
          Selected policy unchanged: PRIVATE, maxImages 6, sequential drain limit 4, one consumer, output backpressure on.
          Removes per-submission transaction/Lease object allocation, redundant empty-pass wakeups, eager disabled diagnostic arguments and duplicate screen-origin notifications.
          Gecko engine, scrolling algorithms, fidelity, chrome and unrelated features unchanged. No Chromium scrolling port in this APK.
          Source/native tests, ARM64 compilation, lint, certificate/manifest/optimization checks passed. Android runtime verification is a separate gate below; Pixel speed and touch latency are not yet measured.
          Source: ${SOURCE_COMMIT}
          EOF
          gh release create "$TAG" dist/*.apk dist/SHA256SUMS dist/SOURCE.txt dist/signature.txt dist/NATIVE_FLAGS.txt --target "$SOURCE_COMMIT" --title 'Bubble 136 — optimized relay_latest_bp' --notes-file dist/NOTES.md --prerelease
      - uses: actions/upload-artifact@v4
        with:
          name: bubble-fast136-arm64
          path: dist/
          retention-days: 7
      - name: Compile the same optimized build type and its instrumentation for emulator
        run: |
          set -euo pipefail
          gradle --no-daemon -PgeckoAbi=x86_64 :app:assemblePerformance :app:assemblePerformanceAndroidTest 2>&1 | tee fast-emulator-build.txt
      - run: sudo chmod a+rw /dev/kvm
      - name: Actual optimized browser display/input/lifetime integration
        id: runtime
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: default
          profile: pixel_2
          ram-size: 3072M
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save
          script: |
            adb shell wm size 720x1280
            adb shell wm density 280
            sleep 20
            adb install -r app/build/outputs/apk/performance/app-performance.apk
            adb install -r app/build/outputs/apk/androidTest/performance/app-performance-androidTest.apk
            adb logcat -c
            timeout 300s adb shell am instrument -w -e class com.mekromn.bubble.RelayLatestBpRuntimeTest com.mekromn.bubble.debug.test/androidx.test.runner.AndroidJUnitRunner > fast-runtime.txt 2>&1 || true
            adb logcat -d > fast-logcat.txt
            adb pull /sdcard/Android/data/com.mekromn.bubble.debug/files/evidence runtime-evidence || true
            cat fast-runtime.txt
            grep -q 'OK (1 test)' fast-runtime.txt
      - name: Preserve validation, including failures
        if: always() && !cancelled()
        env:
          RUNTIME: ${{ steps.runtime.outcome }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p evidence
          echo "Optimized Android 16 emulator integration: $RUNTIME. Emulator geometry is reduced for software-renderer correctness testing, NOT Pixel performance evidence. No Chromium engine port shipped." > evidence/STATUS.txt
          cp fast-*.txt native-unit-tests.txt evidence/ 2>/dev/null || true
          cp -r runtime-evidence app/build/reports evidence/ 2>/dev/null || true
          tar -czf fast-verification.tar.gz evidence
          if [ -n "${RELEASE_TAG:-}" ]; then gh release upload "$RELEASE_TAG" fast-verification.tar.gz evidence/STATUS.txt --clobber; fi
      - uses: actions/upload-artifact@v4
        if: always() && !cancelled()
        with:
          name: bubble-fast136-verification
          path: evidence/
          retention-days: 7
