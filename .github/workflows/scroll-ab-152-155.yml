name: Bubble scrolling A-B-A-B validation

on:
  push:
    branches: [scroll-ab-152-155]
    paths:
      - '.github/workflows/scroll-ab-152-155.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.variant }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: A152
            source_ref: 488868cd722a174b8dfccdafd738ac70b23e84fc
            version_code: 152
            version_name: 0.7.24-scroll-a150
            apk_name: Bubble-152-A150-SCROLL-CONTROL-ARM64.apk
            phase_b: false
          - variant: B153
            source_ref: 3458157ae6c86fbda060a8200d025bcbf0d19a8c
            version_code: 153
            version_name: 0.7.25-scroll-b151
            apk_name: Bubble-153-B151-SCROLL-TEST-ARM64.apk
            phase_b: true
          - variant: A154
            source_ref: 488868cd722a174b8dfccdafd738ac70b23e84fc
            version_code: 154
            version_name: 0.7.26-scroll-a150-repeat
            apk_name: Bubble-154-A150-SCROLL-REPEAT-ARM64.apk
            phase_b: false
          - variant: B155
            source_ref: 3458157ae6c86fbda060a8200d025bcbf0d19a8c
            version_code: 155
            version_name: 0.7.27-scroll-b151-repeat
            apk_name: Bubble-155-B151-SCROLL-REPEAT-ARM64.apk
            phase_b: true

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v5
        with:
          ref: ${{ matrix.source_ref }}
          fetch-depth: 1

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-37.1' 'build-tools;36.0.0'

      - name: Validate unmodified source
        shell: bash
        env:
          PHASE_B: ${{ matrix.phase_b }}
        run: |
          set -euo pipefail
          node tools/test-stock-picker-compress147.cjs
          node tools/test-direct-attach148.cjs
          node tools/test-global-opacity149.cjs
          node tools/test-efficiency150.cjs
          if [[ "$PHASE_B" == "true" ]]; then node tools/test-efficiency151.cjs; fi
          node tools/test-foreground.cjs
          node tools/test-fast-build.cjs
          node tools/test-hardware-policy.cjs
          node tools/test-embedded-page.cjs
          bash tools/test-relay-native.sh

      - name: Apply version-only install-order metadata
        shell: bash
        env:
          VERSION_CODE: ${{ matrix.version_code }}
          VERSION_NAME: ${{ matrix.version_name }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          p=Path('app/build.gradle.kts')
          s=p.read_text()
          s=re.sub(r'versionCode = \d+', f'versionCode = {os.environ["VERSION_CODE"]}', s, count=1)
          s=re.sub(r'versionName = "[^"]+"', f'versionName = "{os.environ["VERSION_NAME"]}"', s, count=1)
          p.write_text(s)
          PY

      - name: Build optimized ARM64 comparison APK
        run: |
          set -euo pipefail
          gradle --no-daemon :app:testPerformanceUnitTest :app:assemblePerformance -PgeckoAbi=arm64-v8a
          mkdir -p dist
          cp app/build/outputs/apk/performance/app-performance.apk "dist/${{ matrix.apk_name }}"

      - name: Verify signing, manifest and hardware policy
        run: |
          set -euo pipefail
          apk="dist/${{ matrix.apk_name }}"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk" > dist/signature.txt
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest print "$apk" > dist/AndroidManifest.xml
          python3 tools/audit-hardware-apk.py "$apk" --out dist/HARDWARE_AUDIT.json
          sha256sum "$apk" > dist/SHA256SUMS
          cat > dist/SOURCE.txt <<TXT
          source=${{ matrix.source_ref }}
          variant=${{ matrix.variant }}
          versionCode=${{ matrix.version_code }}
          versionName=${{ matrix.version_name }}
          Only versionCode/versionName differ from the exact source commit.
          TXT

      - uses: actions/upload-artifact@v4
        with:
          name: bubble-scroll-${{ matrix.variant }}-arm64
          path: dist/
          retention-days: 7
