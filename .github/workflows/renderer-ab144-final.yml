name: Bubble 144 renderer A-B final validation
on:
  workflow_dispatch:
  push:
    branches: [renderer-ab144]
    paths: ['.github/workflows/renderer-ab144-final.yml','app/src/androidTest/java/com/mekromn/bubble/RendererABTopologyRuntimeTest.kt']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-37.1' 'build-tools;36.0.0'
      - name: Source and native invariants
        run: |
          set -euo pipefail
          node tools/test-foreground.cjs
          node tools/test-fast-build.cjs
          node tools/test-hardware-policy.cjs
          node tools/test-embedded-page.cjs
          bash tools/test-relay-native.sh
          grep -q 'input!==pageHost.view && input is SurfaceView' app/src/androidTest/java/com/mekromn/bubble/RendererABTopologyRuntimeTest.kt
          grep -q 'input===pageHost.view && input is LiveGeckoView' app/src/androidTest/java/com/mekromn/bubble/RendererABTopologyRuntimeTest.kt
          grep -q 'PageTouchDispatch.Arm.UNBUFFERED_140' app/src/androidTest/java/com/mekromn/bubble/RendererABTopologyRuntimeTest.kt
      - name: Build optimized ARM64 A-B APK
        run: |
          set -euo pipefail
          gradle --no-daemon :app:testPerformanceUnitTest :app:assemblePerformance :app:lintPerformance
          mkdir -p dist
          cp app/build/outputs/apk/performance/app-performance.apk dist/Bubble-144-RENDERER-AB-ARM64.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs dist/Bubble-144-RENDERER-AB-ARM64.apk > dist/signature.txt
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest print dist/Bubble-144-RENDERER-AB-ARM64.apk > dist/AndroidManifest.xml
          python3 tools/audit-hardware-apk.py dist/Bubble-144-RENDERER-AB-ARM64.apk --out dist/HARDWARE_AUDIT.json
          sha256sum dist/Bubble-144-RENDERER-AB-ARM64.apk > dist/SHA256SUMS
          git rev-parse HEAD > dist/SOURCE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: bubble-renderer-ab144-final-arm64
          path: dist/
          retention-days: 7
      - name: Build optimized x86_64 browser and instrumentation
        run: gradle --no-daemon -PgeckoAbi=x86_64 :app:assemblePerformance :app:assemblePerformanceAndroidTest
      - run: sudo chmod a+rw /dev/kvm
      - name: Same-session direct-relay-direct real-window proof
        id: runtime
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: default
          profile: pixel_2
          ram-size: 3072M
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save
          script: |
            adb shell wm size 720x1280
            adb shell wm density 280
            sleep 20
            adb install -r app/build/outputs/apk/performance/app-performance.apk
            adb install -r app/build/outputs/apk/androidTest/performance/app-performance-androidTest.apk
            adb logcat -c
            timeout 300s adb shell am instrument -w -e class com.mekromn.bubble.RendererABTopologyRuntimeTest com.mekromn.bubble.debug.test/androidx.test.runner.AndroidJUnitRunner > renderer-ab-final-runtime.txt 2>&1 || true
            adb logcat -d > renderer-ab-final-logcat.txt
            adb pull /sdcard/Android/data/com.mekromn.bubble.debug/files/evidence runtime-evidence || true
            cat renderer-ab-final-runtime.txt
            cat runtime-evidence/renderer-ab-final.txt 2>/dev/null || true
            grep -q 'OK (1 test)' renderer-ab-final-runtime.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bubble-renderer-ab144-final-runtime
          path: |
            renderer-ab-final-runtime.txt
            renderer-ab-final-logcat.txt
            runtime-evidence/
          retention-days: 7
