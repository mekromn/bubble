name: Bubble 162 Activity-window floating validation

on:
  push:
    branches: [activity-floating162]
    paths:
      - 'app/**'
      - 'tools/**'
      - '.github/workflows/activity-floating161-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply 162 Activity-window crash fix and metadata
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p=Path('app/src/main/java/com/mekromn/bubble/FloatingBrowserActivity.kt')
          s=p.read_text()
          old='''        // The Activity's own PhoneWindow is the floating browser window. No second interactive\n        // WindowManager root is created for expanded mode.\n        runCatching { window.setType(WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY) }\n            .onFailure {\n                service.activityHostFailed(this, "Android rejected Activity overlay window type")\n                finishAndRemoveTask()\n                return\n            }\n'''
          replacement='''        // The Activity's own normal application PhoneWindow is the floating browser window.\n        // Never retag an Activity token as TYPE_APPLICATION_OVERLAY: WindowManager may reject\n        // that token/type pairing only when the decor is attached, which crashes the transition.\n'''
          if old not in s:
              raise SystemExit('expected Build-161 Activity overlay block not found')
          s=s.replace(old,replacement,1)
          s=s.replace(' * Build 161: the expanded floating browser IS the Activity window.',
                      ' * Build 162: the expanded floating browser IS the Activity window.',1)
          s=s.replace(' * and Gecko SurfaceView. Its PhoneWindow is elevated to TYPE_APPLICATION_OVERLAY so the expanded\n * browser can remain in the overlay layer while retaining Activity lifecycle/scheduling semantics.\n',
                      ' * and Gecko SurfaceView. Its PhoneWindow remains a normal application window using the floating,\n * translucent Activity theme plus explicit geometry; Android owns the token/type pairing.\n',1)
          p.write_text(s)

          g=Path('app/build.gradle.kts')
          b=g.read_text()
          b=b.replace('versionCode = 157', 'versionCode = 162', 1)
          b=b.replace('versionName = "0.7.29-opaque-floating-page-baremetal"',
                      'versionName = "0.7.34-single-viewroot-activity-window"', 1)
          g.write_text(b)
          PY
          ! grep -q 'window.setType(WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY)' app/src/main/java/com/mekromn/bubble/FloatingBrowserActivity.kt
          grep -q 'versionCode = 162' app/build.gradle.kts
          grep -q 'versionName = "0.7.34-single-viewroot-activity-window"' app/build.gradle.kts

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-37.1' 'build-tools;36.0.0'

      - name: Prove Build-158 direct renderer remains untouched
        run: |
          set -euo pipefail
          BASE=ec66f727be884aa80ba592ff9e3e1bb6815aff28
          git diff --exit-code "$BASE" HEAD -- \
            app/src/main/java/com/mekromn/bubble/DirectGeckoWindow.kt \
            app/src/main/java/com/mekromn/bubble/EmbeddedPageBackground.kt \
            app/src/main/java/com/mekromn/bubble/RenderPolicy.kt \
            app/src/main/java/com/mekromn/bubble/FloatingPerformancePolicy.kt \
            app/src/main/java/com/mekromn/bubble/PageTouchDispatch.kt \
            app/src/main/java/com/mekromn/bubble/Workspace.kt \
            app/src/main/java/com/mekromn/bubble/RendererArenaActivity.kt

      - name: Activity-window architecture and retained invariants
        run: |
          set -euo pipefail
          node tools/test-activity-floating162.cjs
          node tools/test-single-viewroot158.cjs
          node tools/test-stock-picker-compress147.cjs
          node tools/test-direct-attach148.cjs
          node tools/test-global-opacity149.cjs
          node tools/test-efficiency150.cjs
          node tools/test-efficiency151.cjs
          node tools/test-foreground.cjs
          node tools/test-fast-build.cjs
          node tools/test-hardware-policy.cjs
          node tools/test-embedded-page.cjs
          bash tools/test-relay-native.sh

      - name: Build optimized ARM64 candidate
        run: |
          set -euo pipefail
          gradle --no-daemon :app:testPerformanceUnitTest :app:assemblePerformance :app:lintPerformance -PgeckoAbi=arm64-v8a
          mkdir -p dist
          cp app/build/outputs/apk/performance/app-performance.apk dist/Bubble-162-ACTIVITY-WINDOW-ARM64.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs dist/Bubble-162-ACTIVITY-WINDOW-ARM64.apk > dist/signature.txt
          grep -q '001a6f40ddcff14aec3aca71964fec58c29a32bdd0c649285bce60ae940c2b1f' dist/signature.txt
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest print dist/Bubble-162-ACTIVITY-WINDOW-ARM64.apk > dist/AndroidManifest.xml
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root=ET.parse('dist/AndroidManifest.xml').getroot(); ns='{http://schemas.android.com/apk/res/android}'
          assert root.attrib['package']=='com.mekromn.bubble.debug'
          assert root.attrib[ns+'versionCode']=='162'
          assert root.attrib[ns+'versionName']=='0.7.34-single-viewroot-activity-window'
          app=root.find('application')
          assert app.attrib.get(ns+'debuggable','false')=='false'
          assert app.attrib.get(ns+'hardwareAccelerated')=='true'
          hosts=[a for a in app.findall('activity') if (a.attrib.get(ns+'name') or '').endswith('.FloatingBrowserActivity')]
          assert len(hosts)==1
          host=hosts[0]
          assert host.attrib.get(ns+'exported')=='false'
          assert host.attrib.get(ns+'excludeFromRecents')=='true'
          PY
          python3 tools/audit-hardware-apk.py dist/Bubble-162-ACTIVITY-WINDOW-ARM64.apk --out dist/HARDWARE_AUDIT.json
          sha256sum dist/Bubble-162-ACTIVITY-WINDOW-ARM64.apk > dist/SHA256SUMS
          git rev-parse HEAD > dist/SOURCE.txt
          git diff -- app/src/main/java/com/mekromn/bubble/FloatingBrowserActivity.kt app/build.gradle.kts > dist/BUILD_162_TRANSFORM.patch

      - uses: actions/upload-artifact@v4
        with:
          name: bubble-162-activity-window-arm64
          path: dist/
          retention-days: 7
