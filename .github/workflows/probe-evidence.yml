name: Inspect renderer probe evidence
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing probe release to inspect
        required: true
        default: bubble-probe-34603620563-1
  push:
    branches: [benchmark-probe-build115]
    paths: ['.github/workflows/probe-evidence.yml']
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Collect exact source and existing smoke artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag || 'bubble-probe-34603620563-1' }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^bubble-probe-[0-9]+-[0-9]+$ ]]
          mkdir -p evidence
          git archive HEAD > evidence/probe-source.tar
          git rev-parse HEAD > evidence/SOURCE_COMMIT.txt
          gh release download "$RELEASE_TAG" --pattern probe-smoke.tar --pattern probe-smoke-logcat.txt --pattern SMOKE_STATUS.txt --dir evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exact-probe-source-and-smoke
          path: evidence/
          retention-days: 7
