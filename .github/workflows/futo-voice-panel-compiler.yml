name: FUTO beta13 voice-panel compiler

on:
  push:
    branches:
      - futo-voice-panel-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout compiler harness
        uses: actions/checkout@v4

      - name: Check out exact upstream beta.13 source
        run: |
          git clone --branch v1.4.2-beta.13 --depth 1 --recurse-submodules --shallow-submodules \
            https://github.com/Today20092/voice-input.git voice-input
          cd voice-input
          test "$(git rev-parse HEAD)" = "b9790abf7cbc12fa238618077a4d5e8e69970661"
          grep -F 'versionName "1.4.2-beta.13"' app/build.gradle

      - name: Apply keyboard-panel patch
        run: |
          python3 tools/futo_voice_patch.py voice-input
          python3 tools/futo_voice_bottom_center_refine.py voice-input
          python3 tools/futo_voice_rectangle_fix.py voice-input
          grep -F 'TransformOrigin(0.5f, 1.0f)' voice-input/app/src/main/java/org/futo/voiceinput/RecognizeActivity.kt
          grep -F 'scaleX = 0.04f + (0.96f * revealProgress)' voice-input/app/src/main/java/org/futo/voiceinput/RecognizeActivity.kt
          grep -F 'shape = RoundedCornerShape(0.dp)' voice-input/app/src/main/java/org/futo/voiceinput/RecognizeActivity.kt
          grep -F 'FLAG_ALT_FOCUSABLE_IM' voice-input/app/src/main/java/org/futo/voiceinput/RecognizeActivity.kt
          grep -F 'Color(0xFF5E97F6)' voice-input/app/src/main/java/org/futo/voiceinput/theme/presets/AMOLEDDarkBlue.kt
          grep -F 'AMOLEDDarkBlue.key' voice-input/app/src/main/java/org/futo/voiceinput/theme/ThemeOptions.kt

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android build components from runner SDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Build exact beta13 standalone release
        working-directory: voice-input
        run: |
          ./gradlew :app:assembleStandaloneRelease --no-daemon --stacktrace

      - name: Collect and verify compiler output
        run: |
          APK="$(find voice-input/app/build/outputs/apk/standalone/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee compiler-apk-signature.txt || true
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" | tee compiler-apk-badging.txt
          grep -F "versionName='1.4.2-beta.13-moonshine'" compiler-apk-badging.txt
          mkdir -p release/tools/lib
          cp "$APK" release/futo-voice-input-moonshine-v1.4.2-beta.13_AMOLED_BLUE_KEYBOARD_PANEL_UNSIGNED.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/apksigner" release/tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" release/tools/lib/
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" release/tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/aapt2" release/tools/
          sha256sum release/*.apk | tee release/compiler-SHA256SUMS.txt

      - name: Upload compiler artifact
        uses: actions/upload-artifact@v4
        with:
          name: futo-voice-beta13-panel-compiler-output
          retention-days: 30
          path: |
            release/futo-voice-input-moonshine-v1.4.2-beta.13_AMOLED_BLUE_KEYBOARD_PANEL_UNSIGNED.apk
            release/compiler-SHA256SUMS.txt
            release/tools/apksigner
            release/tools/lib/apksigner.jar
            release/tools/zipalign
            release/tools/aapt2
            compiler-apk-signature.txt
            compiler-apk-badging.txt
