name: Bubble 157 top-app scheduler probe

on:
  push:
    branches: [floating-topapp158]
    paths:
      - 'app/**'
      - 'tools/test-floating-topapp158.cjs'
      - '.github/workflows/floating-topapp158-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-37.1' 'build-tools;36.0.0'

      - name: Scheduler-probe and retained renderer invariants
        run: |
          set -euo pipefail
          node tools/test-floating-topapp158.cjs
          node tools/test-stock-picker-compress147.cjs
          node tools/test-direct-attach148.cjs
          node tools/test-global-opacity149.cjs
          node tools/test-efficiency150.cjs
          node tools/test-efficiency151.cjs
          node tools/test-opaque-page156.cjs
          node tools/test-floating-baremetal157.cjs
          node tools/test-foreground.cjs
          node tools/test-fast-build.cjs
          node tools/test-hardware-policy.cjs
          node tools/test-embedded-page.cjs
          bash tools/test-relay-native.sh

      - name: Build optimized ARM64 scheduler probe
        run: |
          set -euo pipefail
          gradle --no-daemon :app:testPerformanceUnitTest :app:assemblePerformance :app:lintPerformance -PgeckoAbi=arm64-v8a
          mkdir -p dist
          cp app/build/outputs/apk/performance/app-performance.apk dist/Bubble-157-TOPAPP-SCHEDULER-PROBE-ARM64.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs dist/Bubble-157-TOPAPP-SCHEDULER-PROBE-ARM64.apk > dist/signature.txt
          grep -q '001a6f40ddcff14aec3aca71964fec58c29a32bdd0c649285bce60ae940c2b1f' dist/signature.txt
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest print dist/Bubble-157-TOPAPP-SCHEDULER-PROBE-ARM64.apk > dist/AndroidManifest.xml
          grep -q 'versionCode="157"' dist/AndroidManifest.xml
          grep -q 'com.mekromn.bubble.debug' dist/AndroidManifest.xml
          python3 tools/audit-hardware-apk.py dist/Bubble-157-TOPAPP-SCHEDULER-PROBE-ARM64.apk --out dist/HARDWARE_AUDIT.json
          sha256sum dist/Bubble-157-TOPAPP-SCHEDULER-PROBE-ARM64.apk > dist/SHA256SUMS
          git rev-parse HEAD > dist/SOURCE.txt

      - uses: actions/upload-artifact@v4
        with:
          name: bubble-157-topapp-scheduler-probe-arm64
          path: dist/
          retention-days: 7
