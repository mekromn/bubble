name: Bubble fullscreen-to-floating Activity smoke gate

on:
  push:
    branches: [activity-smoketest163]
    paths:
      - 'app/**'
      - 'tools/apply-smoke-root-fix.py'
      - '.github/workflows/activity-floating-smoke163.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply candidate Activity-construction fix in smoke workspace only
        run: python3 tools/apply-smoke-root-fix.py

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Compile x86_64 performance app and instrumentation
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-37.1' 'build-tools;36.0.0'
          gradle --no-daemon :app:assemblePerformance :app:assemblePerformanceAndroidTest -PgeckoAbi=x86_64
          test -f app/build/outputs/apk/performance/app-performance.apk
          test -f app/build/outputs/apk/androidTest/performance/app-performance-androidTest.apk

      - name: Android 16 fullscreen to floating Activity smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -eu
            mkdir -p smoke-evidence
            APP=app/build/outputs/apk/performance/app-performance.apk
            TEST=app/build/outputs/apk/androidTest/performance/app-performance-androidTest.apk
            adb install -r "$APP"
            adb install -r -t "$TEST"
            adb logcat -c
            set +e
            adb shell am instrument -w -r -e class com.mekromn.bubble.ActivityFloatingTransitionSmokeTest com.mekromn.bubble.debug.test/androidx.test.runner.AndroidJUnitRunner > smoke-evidence/instrumentation.txt 2>&1
            TEST_RC=$?
            set -e
            adb logcat -d -v threadtime > smoke-evidence/logcat.txt || true
            adb shell dumpsys activity activities > smoke-evidence/activities.txt || true
            adb shell dumpsys activity processes > smoke-evidence/processes.txt || true
            adb shell dumpsys window windows > smoke-evidence/windows.txt || true
            cat smoke-evidence/instrumentation.txt
            test "$TEST_RC" -eq 0
            grep -q 'OK (1 test)' smoke-evidence/instrumentation.txt
            if grep -E 'FATAL EXCEPTION:|Process: com\.mekromn\.bubble\.debug' smoke-evidence/logcat.txt; then exit 1; fi

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fullscreen-to-floating-smoke-evidence
          path: smoke-evidence/
          retention-days: 7
