name: Bubble fullscreen-to-floating Activity smoke gate

on:
  push:
    branches: [activity-smoketest163]
    paths:
      - 'app/**'
      - 'tools/apply-smoke-root-fix.py'
      - 'tools/run-activity-floating-smoke.sh'
      - '.github/workflows/activity-floating-smoke163.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply candidate Activity-construction fix in smoke workspace only
        run: python3 tools/apply-smoke-root-fix.py

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Compile x86_64 performance app and instrumentation
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-37.1' 'build-tools;36.0.0'
          gradle --no-daemon :app:assemblePerformance :app:assemblePerformanceAndroidTest -PgeckoAbi=x86_64
          test -f app/build/outputs/apk/performance/app-performance.apk
          test -f app/build/outputs/apk/androidTest/performance/app-performance-androidTest.apk

      - name: Android 16 fullscreen to floating Activity smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/run-activity-floating-smoke.sh

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fullscreen-to-floating-smoke-evidence
          path: smoke-evidence/
          retention-days: 7
