name: Bubble fullscreen-to-floating Activity smoke gate

on:
  push:
    branches: [activity-smoketest163]
    paths:
      - 'app/**'
      - '.github/workflows/activity-floating-smoke163.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply candidate Activity-construction fix in smoke workspace only
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/mekromn/bubble/FloatingBrowserActivity.kt')
          s = p.read_text()
          start_token = '    private val root = object : FrameLayout(this) {'
          end_token = '\n\n    override fun onCreate(state: Bundle?) {'
          start = s.index(start_token)
          end = s.index(end_token, start)
          block = s[start:end]
          block = block.replace(start_token, '    private lateinit var root: FrameLayout\n\n    private fun createRoot(): FrameLayout = object : FrameLayout(this) {', 1)
          s = s[:start] + block + s[end:]
          marker = '    override fun onCreate(state: Bundle?) {\n        super.onCreate(state)\n'
          replacement = marker + '        // Views need the Activity base context/theme, which exists only after attach/onCreate.\n        root = createRoot()\n'
          if marker not in s:
              raise SystemExit('onCreate marker not found')
          s = s.replace(marker, replacement, 1)
          p.write_text(s)
          PY
          grep -q 'private lateinit var root: FrameLayout' app/src/main/java/com/mekromn/bubble/FloatingBrowserActivity.kt
          ! grep -q 'private val root = object : FrameLayout(this)' app/src/main/java/com/mekromn/bubble/FloatingBrowserActivity.kt
          grep -q 'root = createRoot()' app/src/main/java/com/mekromn/bubble/FloatingBrowserActivity.kt

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Compile x86_64 performance app + instrumentation only
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-37.1' 'build-tools;36.0.0'
          gradle --no-daemon :app:assemblePerformance :app:assemblePerformanceAndroidTest -PgeckoAbi=x86_64
          test -f app/build/outputs/apk/performance/app-performance.apk
          test -f app/build/outputs/apk/androidTest/performance/app-performance-androidTest.apk

      - name: Android 16 fullscreen -> floating Activity smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -euo pipefail
            mkdir -p smoke-evidence
            APP=app/build/outputs/apk/performance/app-performance.apk
            TEST=app/build/outputs/apk/androidTest/performance/app-performance-androidTest.apk
            adb install -r "$APP"
            adb install -r -t "$TEST"
            adb logcat -c
            set +e
            adb shell am instrument -w -r \
              -e class com.mekromn.bubble.ActivityFloatingTransitionSmokeTest \
              com.mekromn.bubble.debug.test/androidx.test.runner.AndroidJUnitRunner \
              | tee smoke-evidence/instrumentation.txt
            TEST_RC=${PIPESTATUS[0]}
            set -e
            adb logcat -d -v threadtime > smoke-evidence/logcat.txt || true
            adb shell dumpsys activity activities > smoke-evidence/activities.txt || true
            adb shell dumpsys activity processes > smoke-evidence/processes.txt || true
            adb shell dumpsys window windows > smoke-evidence/windows.txt || true
            cat smoke-evidence/instrumentation.txt
            test "$TEST_RC" -eq 0
            grep -q 'OK (1 test)' smoke-evidence/instrumentation.txt
            ! grep -E 'FATAL EXCEPTION:.*|Process: com\.mekromn\.bubble\.debug' smoke-evidence/logcat.txt

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fullscreen-to-floating-smoke-evidence
          path: smoke-evidence/
          retention-days: 7
