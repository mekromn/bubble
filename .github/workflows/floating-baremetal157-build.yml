name: Bubble 157 floating bare-metal validation

on:
  push:
    branches: [floating-seam157]
    paths:
      - 'app/**'
      - 'tools/**'
      - 'docs/FLOATING_BARE_METAL_157.md'
      - '.github/workflows/floating-baremetal157-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-37.1' 'build-tools;36.0.0'

      - name: Bare-metal and retained production invariants
        run: |
          set -euo pipefail
          node tools/test-stock-picker-compress147.cjs
          node tools/test-direct-attach148.cjs
          node tools/test-global-opacity149.cjs
          node tools/test-efficiency150.cjs
          node tools/test-efficiency151.cjs
          node tools/test-opaque-page156.cjs
          node tools/test-floating-baremetal157.cjs
          node tools/test-foreground.cjs
          node tools/test-fast-build.cjs
          node tools/test-hardware-policy.cjs
          node tools/test-embedded-page.cjs
          bash tools/test-relay-native.sh
          bash -n tools/probe-floating-composition.sh

      - name: Build optimized ARM64 candidate
        run: |
          set -euo pipefail
          gradle --no-daemon :app:testPerformanceUnitTest :app:assemblePerformance :app:lintPerformance -PgeckoAbi=arm64-v8a
          mkdir -p dist
          cp app/build/outputs/apk/performance/app-performance.apk dist/Bubble-157-FLOATING-BARE-METAL-ARM64.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs dist/Bubble-157-FLOATING-BARE-METAL-ARM64.apk > dist/signature.txt
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest print dist/Bubble-157-FLOATING-BARE-METAL-ARM64.apk > dist/AndroidManifest.xml
          python3 tools/audit-hardware-apk.py dist/Bubble-157-FLOATING-BARE-METAL-ARM64.apk --out dist/HARDWARE_AUDIT.json
          sha256sum dist/Bubble-157-FLOATING-BARE-METAL-ARM64.apk > dist/SHA256SUMS
          git rev-parse HEAD > dist/SOURCE.txt
          cp docs/FLOATING_BARE_METAL_157.md dist/
          cp tools/probe-floating-composition.sh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: bubble-157-floating-baremetal-arm64
          path: dist/
          retention-days: 7
