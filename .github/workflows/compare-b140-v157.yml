name: Bubble 140 exact-code comparison at version 157

on:
  push:
    branches: [compare-b140-v157]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compare-b140-v157
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Prove application code is exact Bubble 140 except version metadata
        run: |
          set -euo pipefail
          git fetch origin relay-latest-bp-fast140
          python3 - <<'PY'
          import pathlib, re, subprocess
          base_ref='origin/relay-latest-bp-fast140'
          changed=subprocess.check_output(['git','diff','--name-only',base_ref,'HEAD','--','app'],text=True).splitlines()
          assert changed == ['app/build.gradle.kts'], f'unexpected app changes vs Bubble 140: {changed}'
          base=subprocess.check_output(['git','show',f'{base_ref}:app/build.gradle.kts'],text=True)
          cur=pathlib.Path('app/build.gradle.kts').read_text()
          def normalize(text):
              text=re.sub(r'versionCode\s*=\s*\d+', 'versionCode = <VERSION>', text)
              text=re.sub(r'versionName\s*=\s*"[^"]+"', 'versionName = "<VERSION>"', text)
              return text
          assert normalize(base)==normalize(cur), 'build.gradle differs from Bubble 140 beyond version metadata'
          assert re.search(r'versionCode\s*=\s*157\b',cur)
          assert 'versionName = "0.7.29-opaque-floating-page-baremetal"' in cur
          print('Exact Bubble 140 application tree confirmed; only versionCode/versionName are rebadged to current 157 metadata.')
          PY

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-37.1' 'build-tools;36.0.0'

      - name: Bubble 140 retained source/native guards
        env:
          CXX: clang++
        run: |
          set -euo pipefail
          node tools/test-foreground.cjs
          node tools/test-page-input.cjs
          node tools/test-fast-build.cjs
          node tools/test-hardware-policy.cjs
          bash tools/test-relay-native.sh
          node tools/test-embedded-page.cjs

      - name: Build exact Bubble 140 logic with current install version
        run: |
          set -euo pipefail
          echo '4a907a5d115b37e1ea77bc2d744c165e6c3afa4d1aa2faa4762f7d6e1f8d3151  app/signing/bubble-debug.jks' | sha256sum -c -
          gradle --no-daemon :app:testPerformanceUnitTest :app:assemblePerformance :app:lintPerformance -PgeckoAbi=arm64-v8a
          mkdir -p dist
          cp app/build/outputs/apk/performance/app-performance.apk dist/Bubble-140-AS-157-EXACT-CODE-ARM64.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs dist/Bubble-140-AS-157-EXACT-CODE-ARM64.apk > dist/signature.txt
          grep -q '001a6f40ddcff14aec3aca71964fec58c29a32bdd0c649285bce60ae940c2b1f' dist/signature.txt
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest print dist/Bubble-140-AS-157-EXACT-CODE-ARM64.apk > dist/AndroidManifest.xml
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root=ET.parse('dist/AndroidManifest.xml').getroot(); ns='{http://schemas.android.com/apk/res/android}'
          assert root.attrib['package']=='com.mekromn.bubble.debug'
          assert root.attrib[ns+'versionCode']=='157'
          assert root.attrib[ns+'versionName']=='0.7.29-opaque-floating-page-baremetal'
          app=root.find('application')
          assert app.attrib.get(ns+'debuggable','false')=='false'
          print('Manifest/install identity matches current Bubble 157 exactly.')
          PY
          python3 tools/audit-hardware-apk.py dist/Bubble-140-AS-157-EXACT-CODE-ARM64.apk --out dist/HARDWARE_AUDIT.json
          sha256sum dist/Bubble-140-AS-157-EXACT-CODE-ARM64.apk > dist/SHA256SUMS
          git rev-parse HEAD > dist/SOURCE.txt
          git rev-parse origin/relay-latest-bp-fast140 > dist/BUBBLE140_BASE.txt
          git diff --stat origin/relay-latest-bp-fast140 HEAD -- app > dist/APP_DIFF_STAT.txt

      - uses: actions/upload-artifact@v4
        with:
          name: bubble-140-as-157-exact-code-arm64
          path: dist/
          retention-days: 7
