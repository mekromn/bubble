name: Bubble renderer probe
on:
  workflow_dispatch:
  push:
    branches: [benchmark-probe-build115]
    paths:
      - 'renderer-probe/**'
      - 'tools/*probe*'
      - '.github/workflows/renderer-probe.yml'
permissions:
  contents: write
concurrency:
  group: renderer-probe-${{ github.ref }}
  cancel-in-progress: true
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - name: Host source and analysis tests
        run: |
          node tools/test-renderer-probe.cjs
          python3 tools/test-probe-comparison.py
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - uses: android-actions/setup-android@v3
        with:
          log-accepted-android-sdk-licenses: false
          packages: platform-tools
      - run: sdkmanager 'platforms;android-37.1' 'build-tools;36.0.0'
      - name: Compile, unit-test, lint, and sign separate ARM64 probe
        run: |
          set -euo pipefail
          echo '4a907a5d115b37e1ea77bc2d744c165e6c3afa4d1aa2faa4762f7d6e1f8d3151  app/signing/bubble-debug.jks' | sha256sum -c -
          gradle --no-daemon -p renderer-probe testDebugUnitTest assembleDebug lintDebug engineIdentity 2>&1 | tee probe-build.txt
          mkdir -p dist
          cp renderer-probe/build/outputs/apk/debug/*.apk dist/Bubble-Renderer-Probe-ARM64.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs dist/*.apk > dist/signature.txt
          cp renderer-probe/build/engine-identity.txt dist/ENGINE.txt
          sha256sum dist/*.apk > dist/SHA256SUMS
          git rev-parse HEAD > dist/COMMIT.txt
      - name: Publish compiled probe, without claiming device performance
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="bubble-probe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cat > dist/NOTES.md <<EOF_NOTES
          # Bubble Renderer Probe — build ${GITHUB_RUN_NUMBER}
          Separate package: com.mekromn.bubble.probe. Android 16+ ARM64.
          Production Bubble and its profiles are unchanged.
          Host tests, Android/NDK compilation, unit tests, lint, and signing passed.
          Emulator smoke verification is a separate gate. No physical Pixel benchmark or 120-fps claim is made.
          Start Quick A/B, then the matrix; export the reports from Downloads/Bubble Benchmarks.
          See docs/RENDERER_PROBE.md for measurement definitions and limitations.
          Source: ${GITHUB_SHA}
          EOF_NOTES
          gh release create "$TAG" dist/*.apk dist/SHA256SUMS dist/signature.txt dist/ENGINE.txt dist/COMMIT.txt --target "$GITHUB_SHA" \
            --title "Bubble Renderer Probe — build ${GITHUB_RUN_NUMBER}" --notes-file dist/NOTES.md --prerelease
      - name: Compile x86_64 smoke APK
        run: gradle --no-daemon -p renderer-probe -PgeckoAbi=x86_64 assembleDebug
      - name: Enable emulator accelerator
        run: sudo chmod a+rw /dev/kvm
      - name: Android 16 isolated-process smoke suite
        id: smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_7_pro
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/run-renderer-probe-smoke.sh
      - name: Attach smoke evidence to existing release
        if: always() && !cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SMOKE: ${{ steps.smoke.outcome }}
        run: |
          mkdir -p dist
          echo "Emulator smoke: $SMOKE. Physical Pixel results remain untested." > dist/SMOKE_STATUS.txt
          TAG="bubble-probe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/SMOKE_STATUS.txt --clobber
            for file in probe-build.txt probe-smoke-logcat.txt dist/probe-smoke.tar; do
              if [ -f "$file" ]; then gh release upload "$TAG" "$file" --clobber; fi
            done
          fi
