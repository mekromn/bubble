name: Apply Bubble 143 expand-watchdog hardening
on:
  workflow_dispatch:
  push:
    branches: [hybrid-direct143]
    paths: ['.github/workflows/hybrid143-fix-call.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Keep fullscreen expand failsafe active through the morph
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/mekromn/bubble/FullscreenHandoff.kt')
          s=p.read_text()
          def one(old,new):
              global s
              assert s.count(old)==1, ('matches',s.count(old),old[:120])
              s=s.replace(old,new,1)

          one('''    fun finishIntoFullscreen(activity: Activity, root: View) {\n        val overlay=expandOverlay ?: run { root.alpha=1f; return }\n        clearExpandWatchdog()\n        pendingExpandFrame=null\n''',
              '''    fun finishIntoFullscreen(activity: Activity, root: View) {\n        val overlay=expandOverlay ?: run { root.alpha=1f; return }\n        // Stage two: once a live destination exists, keep a fresh watchdog through the actual morph.\n        // If that destination disappears mid-animation, recovery restores it to opaque before the\n        // frozen frame is removed, so we cannot strand either an overlay or a near-transparent root.\n        scheduleExpandWatchdog(overlay, root)\n        pendingExpandFrame=null\n''')

          one('''            if(activity.isFinishing) {\n                root.alpha=1f\n                if(expandOverlay===overlay)expandOverlay=null\n                overlay.detach(); return\n            }\n''',
              '''            if(activity.isFinishing) {\n                clearExpandWatchdog()\n                root.alpha=1f\n                if(expandOverlay===overlay)expandOverlay=null\n                overlay.detach(); return\n            }\n''')

          one('''                else { root.alpha=1f; if(expandOverlay===overlay)expandOverlay=null; overlay.detach() }\n''',
              '''                else { clearExpandWatchdog(); root.alpha=1f; if(expandOverlay===overlay)expandOverlay=null; overlay.detach() }\n''')

          one('''                overlay.morphInto(root,durationMs=300L,crossfadeStart=.72f) {\n                    root.alpha=1f\n                    if(expandOverlay===overlay)expandOverlay=null\n                    overlay.detach()\n                    activity.intent?.removeExtra(EXTRA_FROM_FLOATING)\n                }\n''',
              '''                overlay.morphInto(root,durationMs=300L,crossfadeStart=.72f) {\n                    clearExpandWatchdog()\n                    root.alpha=1f\n                    if(expandOverlay===overlay)expandOverlay=null\n                    overlay.detach()\n                    activity.intent?.removeExtra(EXTRA_FROM_FLOATING)\n                }\n''')

          one('''    private fun scheduleExpandWatchdog(overlay: FullscreenShrinkOverlay) {\n        clearExpandWatchdog()\n        val watchdog = Runnable {\n            if (expandOverlay === overlay) {\n                expandOverlay = null\n                pendingExpandFrame = null\n                overlay.detach()\n            }\n        }\n''',
              '''    private fun scheduleExpandWatchdog(overlay: FullscreenShrinkOverlay, liveDestination: View? = null) {\n        clearExpandWatchdog()\n        val watchdog = Runnable {\n            if (expandOverlay === overlay) {\n                // A stage-two timeout can happen after the live root was intentionally warmed at a\n                // tiny alpha. Restore its normal transform/opacity before removing the frozen frame.\n                liveDestination?.let(::reset)\n                expandWatchdog = null\n                expandOverlay = null\n                pendingExpandFrame = null\n                overlay.detach()\n            }\n        }\n''')
          p.write_text(s)
          PY
          git diff --check
          grep -q 'scheduleExpandWatchdog(overlay, root)' app/src/main/java/com/mekromn/bubble/FullscreenHandoff.kt
          grep -q 'liveDestination?.let(::reset)' app/src/main/java/com/mekromn/bubble/FullscreenHandoff.kt
          git add app/src/main/java/com/mekromn/bubble/FullscreenHandoff.kt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(handoff): keep expand watchdog active through morph completion'
          git push origin HEAD:hybrid-direct143
