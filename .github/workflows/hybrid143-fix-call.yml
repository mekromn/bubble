name: Bubble 143 SurfaceView composition diagnosis
on:
  workflow_dispatch:
  push:
    branches: [hybrid-direct143]
    paths: ['.github/workflows/hybrid143-fix-call.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Fix diagnostic-only Gecko view lookup thread
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/androidTest/java/com/mekromn/bubble/HybridDirectRuntimeTest.kt')
          s=p.read_text()
          old='''        val host=requireNotNull(inputHost()) as LiveGeckoView\n'''
          new='''        var hostValue: LiveGeckoView?=null\n        main { hostValue=inputHost() as? LiveGeckoView }\n        val host=requireNotNull(hostValue)\n'''
          assert old in s
          p.write_text(s.replace(old,new,1))
          PY
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-37.1' 'build-tools;36.0.0'
      - name: Build optimized x86_64 production app plus diagnostic test only
        run: |
          set -euo pipefail
          gradle --no-daemon -PgeckoAbi=x86_64 :app:assemblePerformance :app:assemblePerformanceAndroidTest 2>&1 | tee diagnostic-build.txt
      - run: sudo chmod a+rw /dev/kvm
      - name: Sample Gecko compositor, SurfaceView and final screen independently
        id: device
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: default
          profile: pixel_2
          ram-size: 3072M
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save
          script: |
            adb shell wm size 720x1280
            adb shell wm density 280
            sleep 20
            adb install -r app/build/outputs/apk/performance/app-performance.apk
            adb install -r app/build/outputs/apk/androidTest/performance/app-performance-androidTest.apk
            adb logcat -c
            timeout 240s adb shell am instrument -w -e class com.mekromn.bubble.HybridDirectRuntimeTest com.mekromn.bubble.debug.test/androidx.test.runner.AndroidJUnitRunner > diagnostic-runtime.txt 2>&1 || true
            adb logcat -d > diagnostic-logcat.txt
            adb pull /sdcard/Android/data/com.mekromn.bubble.debug/files/evidence diagnostic-evidence || true
            cat diagnostic-runtime.txt
            cat diagnostic-evidence/direct-surface-diagnostic.txt 2>/dev/null || true
            grep -q 'OK (1 test)' diagnostic-runtime.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bubble143-surface-composition-diagnosis
          path: |
            diagnostic-build.txt
            diagnostic-runtime.txt
            diagnostic-logcat.txt
            diagnostic-evidence/
          retention-days: 7
