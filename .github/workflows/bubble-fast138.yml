name: Bubble 138 demand-driven relay
on:
  workflow_dispatch:
  push:
    branches: [relay-latest-bp-fast138]
    paths: ['app/**', 'tools/**', '.github/workflows/bubble-fast138.yml', 'build.gradle.kts', 'settings.gradle.kts', 'gradle.properties']
permissions:
  contents: write
concurrency:
  group: bubble-fast138
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Materialize hash-checked patch as ordinary source once
        run: |
          set -euo pipefail
          if [ -f tools/build138.patch.xz ]; then
            echo '2129c2c54151ffbc657f4776afdf52e75a48b25a5c7384e037b55771157f56d3  tools/build138.patch.xz' | sha256sum -c -
            xz -dc tools/build138.patch.xz > /tmp/build138.patch
            echo '0ed3f006a256c608214f949e519ecdd2ef4219ec38016449d9ca0fe9189050bc  /tmp/build138.patch' | sha256sum -c -
            git apply --check /tmp/build138.patch
            git apply /tmp/build138.patch
            git rm tools/build138.patch.xz
            git add app tools docs
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'perf(relay): eliminate release-only acquisition passes with race-safe capacity handoff'
            git push origin HEAD:relay-latest-bp-fast138
          fi
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git diff --exit-code 837d575fc615d9d44ff572d98323dfebb61528de HEAD -- app/src/main/java app/src/main/assets app/src/main/AndroidManifest.xml app/src/performance app/proguard-performance.pro app/signing
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Correctness, sanitizers and controlled operation counts
        env:
          CXX: clang++
        run: |
          set -euo pipefail
          node tools/test-foreground.cjs | tee foreground-tests.txt
          node tools/test-fast-build.cjs
          node tools/test-hardware-policy.cjs
          bash tools/test-relay-native.sh | tee native-unit-tests.txt
          bash tools/compare-relay-idle.sh | tee idle-comparison.json
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
          cache-read-only: false
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-37.1' 'build-tools;36.0.0'
      - name: Build optimized signed ARM64 browser
        id: build
        run: |
          set -euo pipefail
          echo '4a907a5d115b37e1ea77bc2d744c165e6c3afa4d1aa2faa4762f7d6e1f8d3151  app/signing/bubble-debug.jks' | sha256sum -c -
          gradle --no-daemon :app:testPerformanceUnitTest :app:assemblePerformance :app:lintPerformance 2>&1 | tee fast-build.txt
          mkdir -p dist
          cp app/build/outputs/apk/performance/app-performance.apk dist/Bubble-138-relay-latest-bp-DEMAND-ARM64.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs dist/*.apk > dist/signature.txt
          grep -q '001a6f40ddcff14aec3aca71964fec58c29a32bdd0c649285bce60ae940c2b1f' dist/signature.txt
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest print dist/*.apk > dist/AndroidManifest.xml
          python3 - <<'PY'
          import json, xml.etree.ElementTree as ET
          from pathlib import Path
          root=ET.parse('dist/AndroidManifest.xml').getroot();ns='{http://schemas.android.com/apk/res/android}'
          assert root.attrib['package']=='com.mekromn.bubble.debug'
          assert root.attrib[ns+'versionCode']=='138'
          app=root.find('application');assert app.attrib.get(ns+'debuggable','false')=='false'
          assert app.find('profileable').attrib[ns+'shell']=='true'
          assert app.attrib.get(ns+'hardwareAccelerated')=='true'
          flags=[]
          for path in Path('app/.cxx').rglob('compile_commands.json'):
              for entry in json.loads(path.read_text()):
                  if entry['file'].endswith('bubble_ahb.cpp'):
                      command=entry.get('command',' '.join(entry.get('arguments',[])))
                      if '-O3' in command and '-flto=thin' in command: flags.append(command)
          assert flags,'Native optimized compile flags missing'
          Path('dist/NATIVE_FLAGS.txt').write_text('\n'.join(flags))
          PY
          python3 tools/audit-hardware-apk.py dist/Bubble-138-relay-latest-bp-DEMAND-ARM64.apk --out dist/HARDWARE_AUDIT.json
          cp docs/BUILD138_DEMAND_WAKE.md native-unit-tests.txt idle-comparison.json dist/
          cp -r app/build/outputs/mapping/performance dist/r8-mapping
          sha256sum dist/*.apk > dist/SHA256SUMS
          git rev-parse HEAD > dist/SOURCE.txt
          git archive HEAD -- . ':!app/signing' | gzip > dist/source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: bubble-fast138-arm64
          path: dist/
          retention-days: 7
      - name: Build the same optimized type for x86_64 instrumentation
        run: |
          set -euo pipefail
          gradle --no-daemon -PgeckoAbi=x86_64 :app:assemblePerformance :app:assemblePerformanceAndroidTest 2>&1 | tee fast-emulator-build.txt
      - run: sudo chmod a+rw /dev/kvm
      - name: Actual browser idle-resume, pixels, input, transitions and lifetime
        id: runtime
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: default
          profile: pixel_2
          ram-size: 3072M
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save
          script: |
            adb shell wm size 720x1280
            adb shell wm density 280
            sleep 20
            adb install -r app/build/outputs/apk/performance/app-performance.apk
            adb install -r app/build/outputs/apk/androidTest/performance/app-performance-androidTest.apk
            adb logcat -c
            timeout 300s adb shell am instrument -w -e class com.mekromn.bubble.RelayLatestBpRuntimeTest com.mekromn.bubble.debug.test/androidx.test.runner.AndroidJUnitRunner > fast-runtime.txt 2>&1 || true
            adb logcat -d > fast-logcat.txt
            adb pull /sdcard/Android/data/com.mekromn.bubble.debug/files/evidence runtime-evidence || true
            cat fast-runtime.txt
            grep -q 'OK (1 test)' fast-runtime.txt
      - name: Preserve exact verification result
        if: always() && !cancelled()
        env:
          RUNTIME: ${{ steps.runtime.outcome }}
        run: |
          mkdir -p evidence
          printf 'Android 16 optimized browser test: %s\nSource: %s\nSoftware-emulated x86_64 correctness test, not Pixel performance. No Chromium engine port in this APK.\n' "$RUNTIME" "$SOURCE_COMMIT" > evidence/STATUS.txt
          cp fast-*.txt native-unit-tests.txt idle-comparison.json foreground-tests.txt evidence/ 2>/dev/null || true
          cp -r runtime-evidence app/build/reports evidence/ 2>/dev/null || true
          tar -czf fast138-verification.tar.gz evidence
      - uses: actions/upload-artifact@v4
        if: always() && !cancelled()
        with:
          name: bubble-fast138-verification
          path: evidence/
          retention-days: 7
      - name: Publish only after actual optimized Android test passes
        if: success() && steps.runtime.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="bubble-fast-138-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cat > dist/NOTES.md <<EOF
          Bubble 138 — demand-driven relay wakeups
          Actual browser. Same update identity, non-debuggable, R8 optimized, native -O3/ThinLTO, same hardware preferences and no native-relay logging.
          Selected PRIVATE / maxImages 6 / sequential drain 4 / one consumer / backpressure ON behavior is unchanged.
          Removes release-only empty consumer passes. A shared atomic release-epoch/waiter handshake retains capacity recovery even when release races MAX_IMAGES handling.
          Source guards, sanitizer stress tests, deterministic before/after operation counts, ARM64 tests/lint/signing/binary checks and optimized Android 16 browser runtime passed.
          Runtime includes visible page changes after idle, typing, cold floating tab, swaps, resize, fullscreen return, cleanup and all 13 Gecko preference readbacks.
          Emulator correctness and host operation counts are NOT Pixel speed or touch-latency measurements. Engine binaries and page scripts unchanged; no direct-engine target or Chromium scrolling port shipped.
          Source: ${SOURCE_COMMIT}
          EOF
          gh release create "$TAG" dist/*.apk dist/SHA256SUMS dist/SOURCE.txt dist/signature.txt dist/HARDWARE_AUDIT.json dist/idle-comparison.json fast138-verification.tar.gz --target "$SOURCE_COMMIT" --title 'Bubble 138 — demand-driven relay' --notes-file dist/NOTES.md --prerelease
