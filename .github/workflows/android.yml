name: Android CI

on:
  push:
    branches: [main, implementation-v1]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Android lint
        run: gradle --no-daemon :app:lintDebug

      - name: Debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Release compile check
        run: gradle --no-daemon :app:assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Bubble-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Room schemas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Bubble-room-schemas
          path: app/schemas
          if-no-files-found: warn
