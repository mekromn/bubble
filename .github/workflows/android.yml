name: Android CI

on:
  push:
    branches: [main, implementation-v1]
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '11076708'
          packages: platform-tools

      - name: Install API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      # Build and preserve a testable artifact before static-analysis gating. A red
      # lint result still blocks production acceptance, but should not prevent
      # device testing of code that already compiles and passes unit tests.
      - name: Debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Release compile check
        run: gradle --no-daemon :app:assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Bubble-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Android lint
        run: gradle --no-daemon :app:lintDebug

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Bubble-lint-reports
          path: |
            app/build/reports/lint-results-debug.*
            app/build/intermediates/lint_intermediate_text_report/**/lint-results-debug.txt
          if-no-files-found: warn

      - name: Upload Room schemas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Bubble-room-schemas
          path: app/schemas
          if-no-files-found: warn
