name: Bubble rebuild verification
on:
  push:
    branches: [rebuild-v2]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bubble-rebuild-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
          cache-read-only: false
      - uses: android-actions/setup-android@v3
        with:
          log-accepted-android-sdk-licenses: false
          packages: platform-tools
      - name: Verify existing signing identity
        run: echo '4a907a5d115b37e1ea77bc2d744c165e6c3afa4d1aa2faa4762f7d6e1f8d3151  app/signing/bubble-debug.jks' | sha256sum -c -
      - run: sdkmanager 'platforms;android-37.1' 'build-tools;36.0.0'
      - name: Compile and inspect ARM64 APK
        run: |
          set -o pipefail
          gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease :app:lintDebug 2>&1 | tee build-output.txt
          mkdir -p dist
          VERSION=$(python3 -c 'import json; print(json.load(open("app/build/outputs/apk/debug/output-metadata.json"))["elements"][0]["versionName"])')
          cp app/build/outputs/apk/debug/*.apk "dist/Bubble-${VERSION}-Rebuild-ARM64.apk"
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --print-certs dist/*.apk | tee dist/signature.txt
          sha256sum dist/*.apk > dist/SHA256SUMS
          git rev-parse HEAD > dist/COMMIT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Bubble-rebuild-ARM64
          path: dist/
      - name: Compile emulator build
        run: |
          set -o pipefail
          gradle --no-daemon -PgeckoAbi=x86_64 :app:assembleDebug :app:assembleDebugAndroidTest 2>&1 | tee emulator-build.txt
      - name: Enable runner access to emulator accelerator
        run: sudo chmod a+rw /dev/kvm
      - name: Android 16 compositor smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_7_pro
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb logcat -c
            adb shell am instrument -w com.mekromn.bubble.debug.test/androidx.test.runner.AndroidJUnitRunner | tee instrumentation.txt
            adb pull /sdcard/Android/data/com.mekromn.bubble.debug/files/evidence/ evidence/ || true
            adb logcat -d > emulator-logcat.txt
            grep -q 'OK (' instrumentation.txt
      - name: Source snapshot
        if: always()
        run: git archive --format=zip HEAD -o Bubble-rebuild-source.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Bubble-runtime-evidence
          path: |
            evidence/
            instrumentation.txt
            emulator-logcat.txt
            build-output.txt
            emulator-build.txt
            app/build/reports/
            Bubble-rebuild-source.zip
