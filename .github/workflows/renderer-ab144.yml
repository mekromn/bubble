name: Bubble 144 renderer A-B
on:
  workflow_dispatch:
  push:
    branches: [renderer-ab144]
    paths:
      - 'app/**'
      - 'tools/**'
      - '.github/workflows/renderer-ab144.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-37.1' 'build-tools;36.0.0'
      - name: Source, transport and native invariants
        run: |
          set -euo pipefail
          node tools/test-foreground.cjs
          node tools/test-fast-build.cjs
          node tools/test-hardware-policy.cjs
          node tools/test-embedded-page.cjs
          bash tools/test-relay-native.sh
          python3 - <<'PY'
          from pathlib import Path
          build=Path('app/build.gradle.kts').read_text()
          manifest=Path('app/src/main/AndroidManifest.xml').read_text()
          controller=Path('app/src/main/java/com/mekromn/bubble/RendererArenaActivity.kt').read_text()
          window=Path('app/src/main/java/com/mekromn/bubble/FloatingWindow.kt').read_text()
          direct=Path('app/src/main/java/com/mekromn/bubble/DirectGeckoWindow.kt').read_text()
          test=Path('app/src/androidTest/java/com/mekromn/bubble/RendererABRuntimeTest.kt').read_text()
          assert 'versionCode = 144' in build and '0.7.16-renderer-ab' in build
          assert 'RendererArenaActivity' in manifest and 'Bubble 140↔143 A/B' in manifest
          assert '140 baseline — relay_latest_bp' in controller
          assert '143 direct — Gecko SurfaceView' in controller
          assert controller.count('PageTouchDispatch.arm = PageTouchDispatch.Arm.UNBUFFERED_140') >= 1
          assert 'setRendererTransportForArena' in window
          assert 'setViewBackend(' not in direct
          for required in ('DIRECT->RELAY_LATEST_BP->DIRECT','relay-submitted-new-frame','relay-retired','same GeckoSession'):
              assert required in test, required
          PY
      - name: Build optimized signed ARM64 comparison APK
        run: |
          set -euo pipefail
          gradle --no-daemon :app:testPerformanceUnitTest :app:assemblePerformance :app:lintPerformance
          mkdir -p dist
          cp app/build/outputs/apk/performance/app-performance.apk dist/Bubble-144-RENDERER-AB-ARM64.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs dist/Bubble-144-RENDERER-AB-ARM64.apk > dist/signature.txt
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest print dist/Bubble-144-RENDERER-AB-ARM64.apk > dist/AndroidManifest.xml
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root=ET.parse('dist/AndroidManifest.xml').getroot();ns='{http://schemas.android.com/apk/res/android}'
          assert root.attrib['package']=='com.mekromn.bubble.debug'
          assert root.attrib[ns+'versionCode']=='144'
          app=root.find('application')
          assert app.attrib.get(ns+'debuggable','false')=='false'
          assert app.attrib.get(ns+'hardwareAccelerated')=='true'
          names={a.attrib.get(ns+'name','') for a in app.findall('activity')}
          assert 'com.mekromn.bubble.RendererArenaActivity' in names
          PY
          python3 tools/audit-hardware-apk.py dist/Bubble-144-RENDERER-AB-ARM64.apk --out dist/HARDWARE_AUDIT.json
          sha256sum dist/Bubble-144-RENDERER-AB-ARM64.apk > dist/SHA256SUMS
          git rev-parse HEAD > dist/SOURCE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: bubble-renderer-ab144-arm64
          path: dist/
          retention-days: 7
      - name: Build optimized x86_64 browser and comparison instrumentation
        run: gradle --no-daemon -PgeckoAbi=x86_64 :app:assemblePerformance :app:assemblePerformanceAndroidTest
      - run: sudo chmod a+rw /dev/kvm
      - name: Same-session direct-relay-direct production-window proof
        id: runtime
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: default
          profile: pixel_2
          ram-size: 3072M
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save
          script: |
            adb shell wm size 720x1280
            adb shell wm density 280
            sleep 20
            adb install -r app/build/outputs/apk/performance/app-performance.apk
            adb install -r app/build/outputs/apk/androidTest/performance/app-performance-androidTest.apk
            adb logcat -c
            timeout 300s adb shell am instrument -w -e class com.mekromn.bubble.RendererABRuntimeTest com.mekromn.bubble.debug.test/androidx.test.runner.AndroidJUnitRunner > renderer-ab-runtime.txt 2>&1 || true
            adb logcat -d > renderer-ab-logcat.txt
            adb pull /sdcard/Android/data/com.mekromn.bubble.debug/files/evidence runtime-evidence || true
            cat renderer-ab-runtime.txt
            cat runtime-evidence/renderer-ab.txt 2>/dev/null || true
            grep -q 'OK (1 test)' renderer-ab-runtime.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bubble-renderer-ab144-runtime
          path: |
            renderer-ab-runtime.txt
            renderer-ab-logcat.txt
            runtime-evidence/
          retention-days: 7
