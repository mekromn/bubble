name: Bubble 146 pinch and blur validation

on:
  push:
    branches: [pinch-blur-fast146]
    paths:
      - 'app/**'
      - '.github/workflows/pinch-blur146-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-37.1' 'build-tools;36.0.0'

      - name: Source and native invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionCode = 146' app/build.gradle.kts
          grep -q 'two narrow regions' app/src/main/java/com/mekromn/bubble/OverlayGlass.kt
          grep -q 'crossWindowBlurChanged' app/src/main/java/com/mekromn/bubble/FloatingWindow.kt
          ! grep -q 'val nowBlur=OverlayGlass.available' app/src/main/java/com/mekromn/bubble/FloatingWindow.kt
          ! grep -q 'RenderPolicy.vote(context, window.decorView' app/src/main/java/com/mekromn/bubble/OverlayGlass.kt
          grep -q 'PinchBenchmark.beforePage(view, event)' app/src/main/java/com/mekromn/bubble/PageTouchDispatch.kt
          grep -q 'PinchBridge.install(session, addon)' app/src/main/java/com/mekromn/bubble/Workspace.kt
          grep -q 'hardcore pinch A/B' app/src/main/java/com/mekromn/bubble/RendererArenaActivity.kt
          grep -q 'pinch-bench.js' app/src/main/assets/chat-monitor/manifest.json
          grep -q 'NO touch/pointer listeners' app/src/main/assets/chat-monitor/pinch-bench.js
          node tools/test-foreground.cjs
          node tools/test-fast-build.cjs
          node tools/test-hardware-policy.cjs
          node tools/test-embedded-page.cjs
          bash tools/test-relay-native.sh

      - name: Build optimized ARM64 candidate
        run: |
          set -euo pipefail
          gradle --no-daemon :app:testPerformanceUnitTest :app:assemblePerformance :app:lintPerformance -PgeckoAbi=arm64-v8a
          mkdir -p dist
          cp app/build/outputs/apk/performance/app-performance.apk dist/Bubble-146-PINCH-BLUR-ARM64.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs dist/Bubble-146-PINCH-BLUR-ARM64.apk > dist/signature.txt
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest print dist/Bubble-146-PINCH-BLUR-ARM64.apk > dist/AndroidManifest.xml
          python3 tools/audit-hardware-apk.py dist/Bubble-146-PINCH-BLUR-ARM64.apk --out dist/HARDWARE_AUDIT.json
          sha256sum dist/Bubble-146-PINCH-BLUR-ARM64.apk > dist/SHA256SUMS
          git rev-parse HEAD > dist/SOURCE.txt

      - name: Upload ARM64 candidate
        uses: actions/upload-artifact@v4
        with:
          name: bubble-146-pinch-blur-arm64
          path: dist/
          retention-days: 7
