name: Bubble 146 pinch and blur validation

on:
  push:
    branches: [pinch-blur-fast146]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v5
        with:
          ref: pinch-blur-fast146
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-37.1' 'build-tools;36.0.0' 'ndk;30.0.16248370'

      - name: Apply focused 146 source patch
        run: python3 tools/apply_pinch_blur146.py

      - name: Commit patched production source if needed
        shell: bash
        run: |
          if ! git diff --quiet; then
            git config user.name 'bubble-ci'
            git config user.email 'actions@users.noreply.github.com'
            git add app/src/main/java/com/mekromn/bubble/FloatingWindow.kt
            git commit -m 'perf(blur): make blur availability listener-driven'
            git push origin HEAD:pinch-blur-fast146
          fi

      - name: Source invariants
        shell: bash
        run: |
          grep -q 'versionCode = 146' app/build.gradle.kts
          grep -q 'two narrow regions' app/src/main/java/com/mekromn/bubble/OverlayGlass.kt
          grep -q 'crossWindowBlurChanged' app/src/main/java/com/mekromn/bubble/FloatingWindow.kt
          ! grep -q 'val nowBlur=OverlayGlass.available' app/src/main/java/com/mekromn/bubble/FloatingWindow.kt
          ! grep -q 'RenderPolicy.vote(context, window.decorView' app/src/main/java/com/mekromn/bubble/OverlayGlass.kt

      - name: Unit tests
        run: ./gradlew --no-daemon testPerformanceUnitTest

      - name: Build optimized ARM64 APK
        run: ./gradlew --no-daemon :app:assemblePerformance -PgeckoAbi=arm64-v8a

      - name: Lint
        run: ./gradlew --no-daemon :app:lintPerformance -PgeckoAbi=arm64-v8a

      - name: Upload ARM64 candidate
        uses: actions/upload-artifact@v4
        with:
          name: bubble-146-pinch-blur-arm64
          path: app/build/outputs/apk/performance/*.apk
          if-no-files-found: error
